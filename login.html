<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="%230B318F"/><circle cx="50" cy="50" r="40" fill="none" stroke="%237ECEF4" stroke-width="6"/></svg>' />
<title>登录 · CyberNWT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1521; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; display: block; }

  /* ---------- 登录卡片 ---------- */
  .panel {
    position: fixed; z-index: 10;
    right: 8%; top: 50%; transform: translateY(-50%);
    width: 362px; padding: 30px 32px 20px;
    background: rgba(11, 22, 38, 0.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(126, 206, 244, 0.22);
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
    animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(-50%) translateX(40px); }
    to   { opacity: 1; transform: translateY(-50%) translateX(0); }
  }
  .panel.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateY(-50%) translateX(0); }
    25% { transform: translateY(-50%) translateX(-8px); }
    50% { transform: translateY(-50%) translateX(7px); }
    75% { transform: translateY(-50%) translateX(-4px); }
  }

  .brand {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 2px; color: #7ECEF4; margin-bottom: 14px;
  }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #6FBA2C, #00663B);
    box-shadow: 0 0 8px rgba(111, 186, 44, 0.8);
  }
  h1 { font-size: 24px; font-weight: 600; color: #e8f2ff; }
  .sub { font-size: 13px; color: #8fa8c7; margin: 6px 0 20px; }

  .tabs {
    display: flex; padding: 4px; margin-bottom: 18px;
    background: rgba(10, 21, 33, 0.6);
    border: 1px solid rgba(126, 206, 244, 0.14);
    border-radius: 11px;
  }
  .tab {
    flex: 1; padding: 9px 0; border: 0; border-radius: 8px;
    background: transparent; color: #8fa8c7; font-size: 14px;
    cursor: pointer; transition: all 0.25s; font-family: inherit;
  }
  .tab.active {
    background: rgba(126, 206, 244, 0.16);
    color: #fff; font-weight: 600;
  }

  /* 面板改为网格布局，两个表单叠放在同一区域，
     卡片高度始终取较高者（注册表单），登录/注册两种界面尺寸一致 */
  .panel {
    display: grid;
    grid-template-areas: "brand" "title" "sub" "tabs" "form" "hint";
  }
  .panel .brand { grid-area: brand; }
  .panel h1 { grid-area: title; }
  .panel .sub { grid-area: sub; }
  .panel .tabs { grid-area: tabs; }
  .panel .hint { grid-area: hint; }
  .form { grid-area: form; visibility: hidden; }
  .form.active { visibility: visible; }
  label { display: block; font-size: 12px; color: #8fa8c7; margin-bottom: 13px; }
  input {
    width: 100%; margin-top: 6px; padding: 11px 13px;
    background: rgba(10, 21, 33, 0.55);
    border: 1px solid rgba(126, 206, 244, 0.22);
    border-radius: 9px; color: #e8f2ff; font-size: 14px;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  input::placeholder { color: rgba(143, 168, 199, 0.45); }
  input:focus {
    border-color: #7ECEF4;
    box-shadow: 0 0 0 3px rgba(126, 206, 244, 0.14);
  }

  .msg { min-height: 18px; font-size: 12.5px; margin: -4px 0 8px; }
  .msg.err { color: #ff9191; }
  .msg.ok { color: #7ee2a8; }

  .btn {
    width: 100%; padding: 12px 0; border: 0; border-radius: 9px;
    background: linear-gradient(135deg, #1e6fd9, #0b318f);
    color: #fff; font-size: 15px; font-weight: 600; letter-spacing: 6px;
    cursor: pointer; transition: filter 0.2s, transform 0.1s, box-shadow 0.2s;
    font-family: inherit;
  }
  .btn:hover { filter: brightness(1.18); box-shadow: 0 6px 22px rgba(30, 111, 217, 0.45); }
  .btn:active { transform: scale(0.985); }
  .btn:disabled { filter: grayscale(0.5) brightness(0.8); cursor: wait; }

  .hint {
    margin-top: 16px; padding-top: 13px;
    border-top: 1px dashed rgba(126, 206, 244, 0.18);
    font-size: 12px; color: rgba(143, 168, 199, 0.75); text-align: center;
  }
  .hint b { color: #7ECEF4; font-weight: 600; }

  /* 窄屏：Logo 在上方，卡片移到底部居中 */
  @media (max-width: 999px) {
    .panel {
      right: auto; top: auto; bottom: 4vh;
      transform: translateX(-50%);
      left: 50%; width: min(92vw, 400px);
      animation: riseUp 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }
    @keyframes riseUp {
      from { opacity: 0; transform: translateX(-50%) translateY(40px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .panel.shake { animation: shakeX 0.4s ease; }
    @keyframes shakeX {
      0%, 100% { transform: translateX(-50%); }
      25% { transform: translateX(calc(-50% - 8px)); }
      50% { transform: translateX(calc(-50% + 7px)); }
      75% { transform: translateX(calc(-50% - 4px)); }
    }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<main class="panel" id="panel">
  <div class="brand"><span class="dot"></span><span>SANGFOR · AI · SHOW</span></div>
  <h1 id="panel-title">欢迎来到CyberNWT</h1>
  <p class="sub" id="panel-sub">登录以进入项目展示</p>

  <div class="tabs">
    <button type="button" class="tab active" data-tab="login">登 录</button>
    <button type="button" class="tab" data-tab="register">注 册</button>
  </div>

  <form id="login-form" class="form active" novalidate>
    <label>账号
      <input id="login-user" type="text" autocomplete="username" placeholder="请输入账号" />
    </label>
    <label>密码
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="请输入密码" />
    </label>
    <div class="msg" id="login-msg"></div>
    <button class="btn" id="login-btn" type="submit">登 录</button>
  </form>

  <form id="register-form" class="form" novalidate>
    <label>账号
      <input id="reg-user" type="text" autocomplete="username" placeholder="2-20 位字母、数字、下划线或中文" />
    </label>
    <label>密码
      <input id="reg-pass" type="password" autocomplete="new-password" placeholder="至少 6 位" />
    </label>
    <label>确认密码
      <input id="reg-pass2" type="password" autocomplete="new-password" placeholder="再次输入密码" />
    </label>
    <div class="msg" id="reg-msg"></div>
    <button class="btn" id="reg-btn" type="submit">注 册</button>
  </form>

  <p class="hint">演示账号：<b>admin</b>　密码：<b>admin</b></p>
</main>

  const SPRING = 0.025, DAMPING = 0.92, MOUSE_R = 130, MOUSE_F = 0.55;
  const MAX_PARTICLES = 9000;

  function makeSprite(rgb) {
    const s = 48;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0.00, 'rgba(' + rgb + ',1)');
    grad.addColorStop(0.20, 'rgba(' + rgb + ',0.95)');
    grad.addColorStop(0.50, 'rgba(' + rgb + ',0.28)');
    grad.addColorStop(1.00, 'rgba(' + rgb + ',0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
    return c;
  }
  const SPRITES = [makeSprite('255,255,255'), makeSprite('190,228,255'), makeSprite('126,206,244')];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function buildBackground() {
    bg.width = canvas.width;
    bg.height = canvas.height;
    const g = bgCtx;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const lg = g.createLinearGradient(0, 0, W * 0.35, H);
    lg.addColorStop(0, '#0a1521');
    lg.addColorStop(1, '#1b263b');
    g.fillStyle = lg;
    g.fillRect(0, 0, W, H);
    let rg = g.createRadialGradient(W * 0.5, H * 0.36, 0, W * 0.5, H * 0.36, Math.max(W, H) * 0.45);
    rg.addColorStop(0, 'rgba(40,95,190,0.14)');
    rg.addColorStop(1, 'rgba(40,95,190,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);
    rg = g.createRadialGradient(W * 0.85, H * 0.8, 0, W * 0.85, H * 0.8, Math.max(W, H) * 0.4);
    rg.addColorStop(0, 'rgba(22,110,88,0.10)');
    rg.addColorStop(1, 'rgba(22,110,88,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(130,170,230,0.05)';
    g.lineWidth = 1;
    const step = 46;
    g.beginPath();
    for (let x = 0.5; x < W; x += step) { g.moveTo(x, 0); g.lineTo(x, H); }
    for (let y = 0.5; y < H; y += step) { g.moveTo(0, y); g.lineTo(W, y); }
    g.stroke();
    const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(5,10,18,0)');
    vg.addColorStop(1, 'rgba(5,10,18,0.5)');
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);
  }

  function initDust() {
    dust.length = 0;
    const n = Math.round(W * H / 16000);
    for (let i = 0; i < n; i++) {
      dust.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.06, vy: -0.02 - Math.random() * 0.08,
        s: Math.random() < 0.8 ? 1 : 1.6, a: 0.12 + Math.random() * 0.3,
        tw: Math.random() * Math.PI * 2, ts: 0.5 + Math.random() * 1.5,
        c: Math.random() < 0.7 ? 'rgba(255,255,255,0.9)' : 'rgba(150,205,255,0.9)'
      });
    }
  }

  function makeParticle(hx, hy, gap, scatter) {
    const jx = hx + (Math.random() - 0.5) * gap * 0.7;
    const jy = hy + (Math.random() - 0.5) * gap * 0.7;
    let px = jx, py = jy;
    if (scatter) {
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.max(W, H) * (0.25 + Math.random() * 0.55);
      px = W / 2 + Math.cos(ang) * rad;
      py = H / 2 + Math.sin(ang) * rad * 0.7;
    }
    const r = Math.random();
    return {
      hx: jx, hy: jy, x: px, y: py, vx: 0, vy: 0,
      spr: r < 0.5 ? 0 : (r < 0.85 ? 1 : 2),
      size: 2.6 + Math.random() * 2.8,
      base: 0.65 + Math.random() * 0.35,
      tw: Math.random() * Math.PI * 2, ts: 0.6 + Math.random() * 1.6
    };
  }

  // Logo 落点：宽屏放左侧与登录卡并排，窄屏放上方
  function logoRect(iw, ih) {
    const wide = W >= 1000;
    let lw = wide ? Math.min(W * 0.42, 900) : W * 0.78;
    let lh = lw * ih / iw;
    const maxH = wide ? H * 0.6 : H * 0.34;
    if (lh > maxH) { lh = maxH; lw = lh * iw / ih; }
    lw = Math.round(lw); lh = Math.round(lh);
    const ox = wide ? Math.round(W * 0.28 - lw / 2) : Math.round((W - lw) / 2);
    const oy = wide ? Math.round((H - lh) / 2 - H * 0.02 - 50) : Math.round(H * 0.09);
    return { lw, lh, ox, oy };
  }

  function buildParticles(scatter) {
    const iw = img.naturalWidth || 354.6;
    const ih = img.naturalHeight || 114.83;
    const r = logoRect(iw, ih);

    const sc = document.createElement('canvas');
    sc.width = r.lw; sc.height = r.lh;
    const sg = sc.getContext('2d');
    sg.drawImage(img, 0, 0, r.lw, r.lh);
    let data;
    try {
      data = sg.getImageData(0, 0, r.lw, r.lh).data;
    } catch (e) {
      console.error('读取像素失败', e);
      return;
    }

    let gap = Math.max(3, Math.round(r.lw / 240));
    for (let tries = 0; tries < 6; tries++) {
      particles = [];
      for (let y = 0; y < r.lh; y += gap) {
        for (let x = 0; x < r.lw; x += gap) {
          if (data[(y * r.lw + x) * 4 + 3] > 130) {
            particles.push(makeParticle(r.ox + x, r.oy + y, gap, scatter));
          }
        }
      }
      if (particles.length <= MAX_PARTICLES) break;
      gap++;
    }
  }

  function step() {
    const mActive = mouse.active, mx = mouse.x, my = mouse.y;
    const r2 = MOUSE_R * MOUSE_R;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.vx += (p.hx - p.x) * SPRING;
      p.vy += (p.hy - p.y) * SPRING;
      if (mActive) {
        const dx = (mx - 55.0) - p.x, dy =(my - 56.0) - p.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < r2 && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const f = (1 - d / MOUSE_R) * MOUSE_F;
          p.vx += dx / d * f;
          p.vy += dy / d * f;
        }
      }
      p.vx *= DAMPING; p.vy *= DAMPING;
      p.x += p.vx; p.y += p.vy;
    }
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      d.x += d.vx; d.y += d.vy;
      if (d.y < -4) { d.y = H + 4; d.x = Math.random() * W; }
      if (d.x < -4) d.x = W + 4; else if (d.x > W + 4) d.x = -4;
    }
  }

  function render(t) {
    ctx.drawImage(bg, 0, 0, W, H);
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      const tw = 0.5 + 0.5 * Math.sin(t * 0.001 * d.ts + d.tw);
      ctx.globalAlpha = d.a * (0.35 + 0.65 * tw);
      ctx.fillStyle = d.c;
      ctx.fillRect(d.x, d.y, d.s, d.s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    const breath = 0.75 + 0.25 * Math.sin(t * 0.0011);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const tw = 0.6 + 0.4 * Math.sin(t * 0.0018 * p.ts + p.tw);
      const s = p.size * (0.8 + 0.35 * tw);
      ctx.globalAlpha = Math.min(1, p.base * tw * breath);
      ctx.drawImage(SPRITES[p.spr], p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function loop(t) {
    requestAnimationFrame(loop);
    step();
    render(t);
  }

  function setMouse(e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  }
  window.addEventListener('pointermove', setMouse);
  window.addEventListener('pointerdown', setMouse);
  document.addEventListener('mouseleave', function () { mouse.active = false; });
  window.addEventListener('blur', function () { mouse.active = false; });

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resize();
      buildBackground();
      initDust();
      if (img.complete && img.naturalWidth) buildParticles(false);
    }, 200);
  });

  resize();
  buildBackground();
  initDust();
  requestAnimationFrame(loop);

  const img = new Image();
  img.onload = function () { buildParticles(true); };
  img.src = LOGO_URI;

  /* ============================================================
   * 登录 / 注册逻辑
   * ============================================================ */
  const $ = function (s) { return document.querySelector(s); };
  const panel = $('#panel');

  // 选项卡切换
  const TITLES = {
    login: ['欢迎来到CyberNWT', '登录以进入项目展示'],
    register: ['创建账号', '注册一个新账号开始体验']
  };
  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      const name = btn.dataset.tab;
      $('#login-form').classList.toggle('active', name === 'login');
      $('#register-form').classList.toggle('active', name === 'register');
      $('#panel-title').textContent = TITLES[name][0];
      $('#panel-sub').textContent = TITLES[name][1];
    });
  });
  function switchTab(name) {
    document.querySelector('.tab[data-tab="' + name + '"]').click();
  }

  function setMsg(id, text, isError) {
    const el = $('#' + id);
    el.textContent = text || '';
    el.classList.toggle('err', !!isError);
    el.classList.toggle('ok', !isError && !!text);
  }

  function shake() {
    panel.classList.remove('shake');
    void panel.offsetWidth; // 重置动画
    panel.classList.add('shake');
  }

  async function api(path, body) {
    let res, data = {};
    try {
      res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      data = await res.json();
    } catch (e) {
      // file:// 直接打开或服务器未启动时走到这里
      return { status: 0, data: { ok: false, message: '无法连接服务器：请先运行 python server.py，再通过 http://127.0.0.1:8642 访问' } };
    }
    return { status: res.status, data: data || {} };
  }

  // ---- 登录 ----
  $('#login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const username = $('#login-user').value.trim();
    const password = $('#login-pass').value;
    setMsg('login-msg', '');
    if (!username || !password) { setMsg('login-msg', '请输入账号和密码', true); shake(); return; }

    const btn = $('#login-btn');
    btn.disabled = true; btn.textContent = '登录中…';
    const { status, data } = await api('/api/login', { username: username, password: password });
    btn.disabled = false; btn.textContent = '登 录';

    if (status === 200 && data.ok) {
      setMsg('login-msg', '登录成功，正在进入…');
      setTimeout(function () { location.href = 'home.html'; }, 350);
    } else {
      setMsg('login-msg', data.message || '登录失败', true);
      shake();
    }
  });

  // ---- 注册 ----
  $('#register-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const username = $('#reg-user').value.trim();
    const password = $('#reg-pass').value;
    const password2 = $('#reg-pass2').value;
    setMsg('reg-msg', '');

    if (!/^[\w\u4e00-\u9fff]{2,20}$/.test(username)) {
      setMsg('reg-msg', '账号需为 2-20 位字母、数字、下划线或中文', true); shake(); return;
    }
    if (password.length < 6) { setMsg('reg-msg', '密码至少 6 位', true); shake(); return; }
    if (password !== password2) { setMsg('reg-msg', '两次输入的密码不一致', true); shake(); return; }

    const btn = $('#reg-btn');
    btn.disabled = true; btn.textContent = '注册中…';
    const { status, data } = await api('/api/register', { username: username, password: password });
    btn.disabled = false; btn.textContent = '注 册';

    if (status === 200 && data.ok) {
      setMsg('reg-msg', '注册成功，请登录');
      $('#login-user').value = username;
      $('#login-pass').value = '';
      setTimeout(function () { switchTab('login'); $('#login-pass').focus(); }, 600);
    } else {
      setMsg('reg-msg', data.message || '注册失败', true);
      shake();
    }
  });
})();
</script>
</body>
</html>
