<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="logo.png" />
<title>登录 · CyberNWT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1521; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; }
  .fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #fluid { z-index: 0; }
  #stage { z-index: 1; } /* 粒子层：液态之上、登录卡之下 */

  /* ---------- 登录卡片 ---------- */
  .panel {
    position: fixed; z-index: 10;
    right: 8%; top: 50%; transform: translateY(-50%);
    width: 362px; padding: 30px 32px 20px;
    background: rgba(208, 214, 222, 0.12);
    backdrop-filter: blur(18px) saturate(1.1);
    -webkit-backdrop-filter: blur(18px) saturate(1.1);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 20px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(-50%) translateX(40px); }
    to   { opacity: 1; transform: translateY(-50%) translateX(0); }
  }
  .panel.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateY(-50%) translateX(0); }
    25% { transform: translateY(-50%) translateX(-8px); }
    50% { transform: translateY(-50%) translateX(7px); }
    75% { transform: translateY(-50%) translateX(-4px); }
  }

  .brand {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 2px; color: #c9cfd8; margin-bottom: 14px;
  }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f5f7fa, #8b929c);
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.55);
  }
  h1 { font-size: 24px; font-weight: 600; color: #f2f4f7; }
  .sub { font-size: 13px; color: #a7b0bb; margin: 6px 0 20px; }

  .tabs {
    display: flex; padding: 4px; margin-bottom: 18px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
  }
  .tab {
    flex: 1; padding: 9px 0; border: 0; border-radius: 8px;
    background: transparent; color: #a7b0bb; font-size: 14px;
    cursor: pointer; transition: all 0.25s; font-family: inherit;
  }
  .tab.active {
    background: rgba(255, 255, 255, 0.18);
    color: #fff; font-weight: 600;
  }

  /* 面板改为网格布局，两个表单叠放在同一区域，
     卡片高度始终取较高者（注册表单），登录/注册两种界面尺寸一致 */
  .panel {
    display: grid;
    grid-template-areas: "brand" "title" "sub" "tabs" "form" "hint";
  }
  .panel .brand { grid-area: brand; }
  .panel h1 { grid-area: title; }
  .panel .sub { grid-area: sub; }
  .panel .tabs { grid-area: tabs; }
  .panel .hint { grid-area: hint; }
  .form { grid-area: form; visibility: hidden; }
  .form.active { visibility: visible; }
  label { display: block; font-size: 12px; color: #a7b0bb; margin-bottom: 13px; }
  input {
    width: 100%; margin-top: 6px; padding: 11px 13px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 12px; color: #f2f4f7; font-size: 14px;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  input::placeholder { color: rgba(231, 236, 242, 0.35); }
  input:focus {
    border-color: rgba(255, 255, 255, 0.55);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
  }

  .msg { min-height: 18px; font-size: 12.5px; margin: -4px 0 8px; }
  .msg.err { color: #ff9191; }
  .msg.ok { color: #7ee2a8; }

  .btn {
    width: 100%; padding: 12px 0; border: 0; border-radius: 12px;
    background: linear-gradient(180deg, #fcfdfe 0%, #e9ecef 35%, #cfd4db 65%, #dfe2e7 100%);
    color: #17191d; font-size: 15px; font-weight: 600; letter-spacing: 6px;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), inset 0 -1px 0 rgba(0, 0, 0, 0.06), 0 6px 22px rgba(0, 0, 0, 0.35);
    cursor: pointer; transition: filter 0.2s, transform 0.1s, box-shadow 0.2s;
    font-family: inherit;
  }
  .btn:hover { filter: brightness(1.04); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), inset 0 -1px 0 rgba(0, 0, 0, 0.06), 0 8px 26px rgba(0, 0, 0, 0.45); }
  .btn:active { transform: scale(0.985); }
  .btn:disabled { filter: grayscale(0.5) brightness(0.92); opacity: 0.65; cursor: wait; }

  .hint {
    margin-top: 16px; padding-top: 13px;
    border-top: 1px dashed rgba(255, 255, 255, 0.18);
    font-size: 12px; color: rgba(167, 176, 187, 0.85); text-align: center;
  }
  .hint b { color: #eef1f5; font-weight: 600; }

  /* 窄屏：Logo 在上方，卡片移到底部居中 */
  @media (max-width: 999px) {
    .panel {
      right: auto; top: auto; bottom: 4vh;
      transform: translateX(-50%);
      left: 50%; width: min(92vw, 400px);
      animation: riseUp 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }
    @keyframes riseUp {
      from { opacity: 0; transform: translateX(-50%) translateY(40px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .panel.shake { animation: shakeX 0.4s ease; }
    @keyframes shakeX {
      0%, 100% { transform: translateX(-50%); }
      25% { transform: translateX(calc(-50% - 8px)); }
      50% { transform: translateX(calc(-50% + 7px)); }
      75% { transform: translateX(calc(-50% - 4px)); }
    }
  }
</style>
</head>
<body>
<canvas id="fluid" class="fx"></canvas>
<canvas id="stage" class="fx"></canvas>

<main class="panel" id="panel">
  <div class="brand"><span class="dot"></span><span>SANGFOR · AI · SHOW</span></div>
  <h1 id="panel-title">欢迎来到CyberNWT</h1>
  <p class="sub" id="panel-sub">登录以进入项目展示</p>

  <div class="tabs">
    <button type="button" class="tab active" data-tab="login">登 录</button>
    <button type="button" class="tab" data-tab="register">注 册</button>
  </div>

  <form id="login-form" class="form active" novalidate>
    <label>账号
      <input id="login-user" type="text" autocomplete="username" placeholder="请输入账号" />
    </label>
    <label>密码
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="请输入密码" />
    </label>
    <div class="msg" id="login-msg"></div>
    <button class="btn" id="login-btn" type="submit">登 录</button>
  </form>

  <form id="register-form" class="form" novalidate>
    <label>账号
      <input id="reg-user" type="text" autocomplete="username" placeholder="2-20 位字母、数字、下划线或中文" />
    </label>
    <label>密码
      <input id="reg-pass" type="password" autocomplete="new-password" placeholder="至少 6 位" />
    </label>
    <label>确认密码
      <input id="reg-pass2" type="password" autocomplete="new-password" placeholder="再次输入密码" />
    </label>
    <div class="msg" id="reg-msg"></div>
    <button class="btn" id="reg-btn" type="submit">注 册</button>
  </form>

  <p class="hint">演示账号：<b>admin</b>　密码：<b>admin</b></p>
</main>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 登录页背景：WebGL2 流体（液态金属流 + 鼠标 flowmap 交互）。
   * 液态层移植自外部演示页；其上叠加本项目原有的 2D 粒子 Logo 引擎
   * （去掉自带渐变底，由液态层提供底色）。弹簧网格仍未引入。
   * ============================================================ */
  const WEBGL2_OK = (function () {
    try { return !!document.createElement('canvas').getContext('webgl2'); } catch (e) { return false; }
  })();
  // ---------- 1. 流体材质背景 ----------
  function initFluid() {
    const canvas = document.getElementById('fluid');
    let gl = null;
    try { gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false, powerPreference: 'low-power' }); } catch (e) {}
    if (!gl) return;

    // 运行参数与 DeepSeek harness 页一致；调色板为黑白灰金属流，给彩色 Logo 粒子留对比
    const CFG = {
      mouseRadius: 0.09, mouseStrength: 1.8, mouseSmoothing: 0.1, mouseVelocity: 0.2, decay: 0.925,
      distortBoost: 2.2, swirlBoost: 0.8, glowIntensity: 0.13,
      glowColors: ['#e8ecef', '#9aa4ae', '#2c343c'],
      speed: 28, scale: 1.77, offsetX: -124, offsetY: -48, grain: 0.005,
      colors: ['#020304', '#101318', '#23282f', '#5a626c', '#a6aeb8'],
      lightCore: 0.1, lightHalo: 0.12, vignette: 0.45,
      bloomThreshold: 0.61, bloomRange: 0.18, bloomStrength: 0.3
    };
    const rgb = function (h) {
      h = h.replace('#', '');
      return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
    };

    const VERT = '#version 300 es\n' +
      'in vec4 a_position;\nout vec2 vUv;\n' +
      'void main() { vUv = a_position.xy * 0.5 + 0.5; gl_Position = a_position; }';

    // flowmap 笔刷：R=鼠标存在感（高斯），GB=速度方向；每帧衰减形成拖尾
    const FRAG_BRUSH = '#version 300 es\n' +
      'precision mediump float;\nin vec2 vUv;\n' +
      'uniform sampler2D u_prev;\nuniform vec2 u_mouse;\nuniform vec2 u_velocity;\n' +
      'uniform float u_brushRadius;\nuniform float u_brushStrength;\nuniform float u_decay;\n' +
      'out vec4 fragColor;\n\n' +
      'void main() {\n' +
      '  vec4 prev = texture(u_prev, vUv);\n' +
      '  prev.r *= u_decay;\n' +
      '  prev.gb = mix(vec2(0.5), prev.gb, u_decay);\n' +
      '  float dist = distance(vUv, u_mouse);\n' +
      '  float influence = exp(-dist * dist / (u_brushRadius * u_brushRadius * 0.5));\n' +
      '  influence = max(0.0, influence - 0.01);\n' +
      '  float speed = length(u_velocity);\n' +
      '  float presenceStrength = u_brushStrength * 0.3;\n' +
      '  float velBonus = min(speed * 3.0, 0.7) * u_brushStrength;\n' +
      '  float totalStrength = presenceStrength + velBonus;\n' +
      '  prev.r = max(prev.r, influence * totalStrength);\n' +
      '  float blendAmt = influence * min(totalStrength, 0.4) * 0.3;\n' +
      '  prev.g = mix(prev.g, clamp(u_velocity.x * 2.0 + 0.5, 0.0, 1.0), blendAmt);\n' +
      '  prev.b = mix(prev.b, clamp(u_velocity.y * 2.0 + 0.5, 0.0, 1.0), blendAmt);\n' +
      '  fragColor = prev;\n' +
      '}';

    // 流体本体：simplex 噪声域扭曲 + flowmap 鼠标扰动/辉光 + 颗粒/bloom/光源/暗角
    const FRAG_FLUID = '#version 300 es\n' +
      'precision mediump float;\nin vec2 vUv;\n' +
      'uniform float u_time;\nuniform vec2 u_resolution;\n' +
      'uniform float u_scale;\nuniform vec2 u_offset;\nuniform float u_grain;\n' +
      'uniform sampler2D u_flowmap;\n' +
      'uniform float u_distortBoost;\nuniform float u_swirlBoost;\nuniform float u_glowIntensity;\n' +
      'uniform vec3 u_glowColor1;\nuniform vec3 u_glowColor2;\nuniform vec3 u_glowColor3;\n' +
      'uniform vec3 u_c1;\nuniform vec3 u_c2;\nuniform vec3 u_c3;\nuniform vec3 u_c4;\nuniform vec3 u_c5;\n' +
      'uniform vec2 u_lightPos;\n' +
      'uniform float u_lightCore;\nuniform float u_lightHalo;\nuniform float u_vignette;\n' +
      'uniform float u_bloomThreshold;\nuniform float u_bloomRange;\nuniform float u_bloomStrength;\n' +
      'out vec4 fragColor;\n\n' +
      'vec3 mod289v3(vec3 x){return x-floor(x*(1./289.))*289.;}\n' +
      'vec4 mod289v4(vec4 x){return x-floor(x*(1./289.))*289.;}\n' +
      'vec4 permute(vec4 x){return mod289v4(((x*34.)+1.)*x);}\n' +
      'vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}\n' +
      'float snoise(vec3 v){\n' +
      '  const vec2 C=vec2(1./6.,1./3.);\n  const vec4 D=vec4(0.,.5,1.,2.);\n' +
      '  vec3 i=floor(v+dot(v,C.yyy));\n  vec3 x0=v-i+dot(i,C.xxx);\n' +
      '  vec3 g=step(x0.yzx,x0.xyz);\n  vec3 l=1.-g;\n' +
      '  vec3 i1=min(g.xyz,l.zxy);\n  vec3 i2=max(g.xyz,l.zxy);\n' +
      '  vec3 x1=x0-i1+C.xxx;\n  vec3 x2=x0-i2+C.yyy;\n  vec3 x3=x0-D.yyy;\n' +
      '  i=mod289v3(i);\n' +
      '  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));\n' +
      '  float n_=.142857142857;\n  vec3 ns=n_*D.wyz-D.xzx;\n' +
      '  vec4 j=p-49.*floor(p*ns.z*ns.z);\n' +
      '  vec4 x_=floor(j*ns.z);\n  vec4 y_=floor(j-7.*x_);\n' +
      '  vec4 x=x_*ns.x+ns.yyyy;\n  vec4 y=y_*ns.x+ns.yyyy;\n' +
      '  vec4 h=1.-abs(x)-abs(y);\n' +
      '  vec4 b0=vec4(x.xy,y.xy);\n  vec4 b1=vec4(x.zw,y.zw);\n' +
      '  vec4 s0=floor(b0)*2.+1.;\n  vec4 s1=floor(b1)*2.+1.;\n' +
      '  vec4 sh=-step(h,vec4(0.));\n' +
      '  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;\n  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;\n' +
      '  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);\n' +
      '  vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);\n' +
      '  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));\n' +
      '  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;\n' +
      '  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);\n' +
      '  m=m*m;\n' +
      '  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));\n' +
      '}\n' +
      'float hash(vec2 p){\n' +
      '  vec3 p3=fract(vec3(p.xyx)*.1031);\n  p3+=dot(p3,p3.yzx+33.33);\n' +
      '  return fract((p3.x+p3.y)*p3.z);\n}\n' +
      'float fbm(vec3 p){\n' +
      '  float v=0.,amp=.6;vec3 shift=vec3(100.);\n' +
      '  for(int i=0;i<1;i++){v+=amp*snoise(p);p=p*2.+shift;amp*=.4;}\n  return v;\n}\n' +
      'float fluidNoise(vec2 uv,float t){\n' +
      '  float n1=fbm(vec3(uv*.6,t*.06));\n  float n2=fbm(vec3(uv*.6+5.2,t*.06+1.3));\n' +
      '  vec2 w1=vec2(n1,n2)*.6;\n' +
      '  float n3=fbm(vec3((uv+w1)*.7+1.7,t*.05+3.1));\n' +
      '  float n4=fbm(vec3((uv+w1)*.7+9.2,t*.05+5.7));\n' +
      '  vec2 w2=vec2(n3,n4)*.5;\n' +
      '  return fbm(vec3((uv+w1+w2)*.5,t*.04));\n}\n' +
      'vec2 curlish(vec2 uv,float t){\n' +
      '  float eps=.02;\n  float n=snoise(vec3(uv*.8,t));\n' +
      '  float nx=snoise(vec3((uv+vec2(eps,0.))*.8,t));\n' +
      '  float ny=snoise(vec3((uv+vec2(0.,eps))*.8,t));\n' +
      '  return vec2(-(ny-n)/eps,(nx-n)/eps)*.003;\n}\n\n' +
      'void main(){\n' +
      '  float aspect=u_resolution.x/u_resolution.y;\n' +
      '  vec2 uv=gl_FragCoord.xy/u_resolution;\n' +
      '  vec2 suv=vec2(uv.x*aspect, uv.y) * u_scale + u_offset;\n' +
      '  float t=u_time;\n\n' +
      '  vec4 flow = texture(u_flowmap, uv);\n' +
      '  float influence = flow.r;\n' +
      '  vec2 flowDir = (flow.gb - 0.5) * 2.0;\n\n' +
      '  suv += flowDir * influence * u_distortBoost * 0.8;\n' +
      '  float swirlAngle = influence * u_swirlBoost * 2.5;\n' +
      '  float cs = cos(swirlAngle), sn = sin(swirlAngle);\n' +
      '  vec2 delta = suv - vec2(uv.x * aspect, uv.y) * u_scale;\n' +
      '  suv += (mat2(cs, sn, -sn, cs) * delta - delta) * influence;\n\n' +
      '  vec2 curl=curlish(suv,t*.04);\n' +
      '  vec2 uvD=suv+curl*12.;\n' +
      '  float f=fluidNoise(uvD,t);\n' +
      '  float swirl=snoise(vec3(uvD*.8+f*1.5,t*.035))*.5+.5;\n' +
      '  float n=f*.5+.5;\n' +
      '  vec3 col=mix(u_c1,u_c2,smoothstep(.2,.5,n));\n' +
      '  col=mix(col,u_c3,smoothstep(.35,.65,n+swirl*.25));\n' +
      '  col=mix(col,u_c4,smoothstep(.6,.85,swirl)*.55);\n' +
      '  col=mix(col,u_c5,smoothstep(.5,.8,n*swirl)*.35);\n\n' +
      '  float glow = smoothstep(0.0, 0.8, influence);\n' +
      '  float glowNoise = snoise(vec3(uvD * 1.5, t * 0.08)) * 0.5 + 0.5;\n' +
      '  float glowDist = smoothstep(0.0, 1.0, influence);\n' +
      '  vec3 glowMix = mix(u_glowColor3, u_glowColor2, glowDist);\n' +
      '  glowMix = mix(glowMix, u_glowColor1, glowDist * glowNoise);\n' +
      '  col = mix(col, glowMix, glow * u_glowIntensity);\n\n' +
      '  if(u_grain>0.0){\n' +
      '    vec2 flowOffset = (uvD - suv) * u_resolution.y;\n' +
      '    vec2 gp = floor((gl_FragCoord.xy + flowOffset) / 5.0);\n' +
      '    float gr=hash(gp)*2.-1.;\n    col+=gr*u_grain;\n  }\n\n' +
      '  float luma=dot(col,vec3(.299,.587,.114));\n' +
      '  float bloom=smoothstep(u_bloomThreshold-u_bloomRange,u_bloomThreshold+u_bloomRange,luma);\n' +
      '  col+=(col*.85+vec3(.15,.145,.13))*bloom*u_bloomStrength;\n\n' +
      '  float ld=length((uv-u_lightPos)*vec2(aspect,1.));\n' +
      '  float core=exp(-ld*ld*4.5);\n  float halo=exp(-ld*1.8);\n' +
      '  col+=vec3(1.,.98,.94)*core*u_lightCore+vec3(.8,.84,.9)*halo*u_lightHalo;\n\n' +
      '  float vig=1.-smoothstep(.35,.75,length(uv-.5));\n' +
      '  col=mix(col*(1.-u_vignette),col,vig);\n' +
      '  fragColor=vec4(col,1.);\n' +
      '}';

    function shader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('fluid shader:', gl.getShaderInfoLog(s));
        return null;
      }
      return s;
    }
    function program(fs) {
      const v = shader(gl.VERTEX_SHADER, VERT), f = shader(gl.FRAGMENT_SHADER, fs);
      if (!v || !f) return null;
      const p = gl.createProgram();
      gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        console.error('fluid link:', gl.getProgramInfoLog(p));
        return null;
      }
      return p;
    }
    function uniforms(p) {
      const o = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) {
        const info = gl.getActiveUniform(p, i);
        o[info.name] = gl.getUniformLocation(p, info.name);
      }
      return o;
    }
    const pBrush = program(FRAG_BRUSH), pFluid = program(FRAG_FLUID);
    if (!pBrush || !pFluid) return;
    const ub = uniforms(pBrush), uf = uniforms(pFluid);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    function bindQuad(p) {
      const a = gl.getAttribLocation(p, 'a_position');
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.enableVertexAttribArray(a);
      gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    }

    // 1/4 分辨率 flowmap 双缓冲（ping-pong）
    function makeTarget(w, h, data) {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, data || null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      return { fbo: fbo, tex: tex };
    }
    const dpr0 = Math.min(window.devicePixelRatio || 1, 1.5);
    const fw = Math.max(2, Math.round(canvas.clientWidth * dpr0 / 4));
    const fh = Math.max(2, Math.round(canvas.clientHeight * dpr0 / 4));
    const seed = new Uint8Array(fw * fh * 4);
    for (let i = 0; i < fw * fh; i++) { seed[i * 4] = 0; seed[i * 4 + 1] = 128; seed[i * 4 + 2] = 128; seed[i * 4 + 3] = 255; }
    let tA = makeTarget(fw, fh, seed), tB = makeTarget(fw, fh, seed), flip = false;

    const m = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5, svx: 0, svy: 0 };
    window.addEventListener('mousemove', function (e) {
      m.x = e.clientX / window.innerWidth;
      m.y = 1 - e.clientY / window.innerHeight;
    });

    let visible = true;
    new IntersectionObserver(function (es) { visible = es[0].isIntersecting; }).observe(canvas);

    const t0 = performance.now();
    let last = 0, cw = 0, ch = 0;
    const STEP = 1000 / 30;

    // 首帧前同步定一次尺寸，避免 rAF 被节流时画布停留在默认大小
    cw = Math.round(canvas.clientWidth * Math.min(window.devicePixelRatio || 1, 1.5)) || 1;
    ch = Math.round(canvas.clientHeight * Math.min(window.devicePixelRatio || 1, 1.5)) || 1;
    canvas.width = cw;
    canvas.height = ch;

    function render(now) {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
      if (w !== cw || h !== ch) { cw = w; ch = h; canvas.width = w; canvas.height = h; }

      m.sx += (m.x - m.sx) * CFG.mouseSmoothing;
      m.sy += (m.y - m.sy) * CFG.mouseSmoothing;
      m.svx += ((m.x - m.sx) * 0.5 - m.svx) * CFG.mouseVelocity;
      m.svy += ((m.y - m.sy) * 0.5 - m.svy) * CFG.mouseVelocity;

      const src = flip ? tA : tB, dst = flip ? tB : tA;
      flip = !flip;

      // pass 1：更新 flowmap
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
      gl.viewport(0, 0, fw, fh);
      gl.useProgram(pBrush);
      bindQuad(pBrush);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, src.tex);
      gl.uniform1i(ub.u_prev, 0);
      gl.uniform2f(ub.u_mouse, m.sx, m.sy);
      gl.uniform2f(ub.u_velocity, m.svx, m.svy);
      gl.uniform1f(ub.u_brushRadius, CFG.mouseRadius);
      gl.uniform1f(ub.u_brushStrength, CFG.mouseStrength);
      gl.uniform1f(ub.u_decay, CFG.decay);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      // pass 2：流体主渲染
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, w, h);
      gl.useProgram(pFluid);
      bindQuad(pFluid);
      gl.bindTexture(gl.TEXTURE_2D, dst.tex);
      gl.uniform1i(uf.u_flowmap, 0);
      gl.uniform1f(uf.u_time, (now - t0) * 0.001 * (CFG.speed / 100));
      gl.uniform2f(uf.u_resolution, w, h);
      gl.uniform1f(uf.u_scale, CFG.scale);
      gl.uniform2f(uf.u_offset, CFG.offsetX / 100, CFG.offsetY / 100);
      gl.uniform1f(uf.u_grain, CFG.grain);
      gl.uniform1f(uf.u_distortBoost, CFG.distortBoost);
      gl.uniform1f(uf.u_swirlBoost, CFG.swirlBoost);
      gl.uniform1f(uf.u_glowIntensity, CFG.glowIntensity);
      const g1 = rgb(CFG.glowColors[0]), g2 = rgb(CFG.glowColors[1]), g3 = rgb(CFG.glowColors[2]);
      gl.uniform3f(uf.u_glowColor1, g1[0], g1[1], g1[2]);
      gl.uniform3f(uf.u_glowColor2, g2[0], g2[1], g2[2]);
      gl.uniform3f(uf.u_glowColor3, g3[0], g3[1], g3[2]);
      for (let i = 0; i < 5; i++) {
        const c = rgb(CFG.colors[i] || CFG.colors[CFG.colors.length - 1]);
        gl.uniform3f(uf['u_c' + (i + 1)], c[0], c[1], c[2]);
      }
      gl.uniform2f(uf.u_lightPos, m.sx, m.sy);
      gl.uniform1f(uf.u_lightCore, CFG.lightCore);
      gl.uniform1f(uf.u_lightHalo, CFG.lightHalo);
      gl.uniform1f(uf.u_vignette, CFG.vignette);
      gl.uniform1f(uf.u_bloomThreshold, CFG.bloomThreshold);
      gl.uniform1f(uf.u_bloomRange, CFG.bloomRange);
      gl.uniform1f(uf.u_bloomStrength, CFG.bloomStrength);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    function frame(now) {
      requestAnimationFrame(frame);
      if (!visible || now - last < STEP) return;
      last = now - (now - last) % STEP;
      render(now);
    }
    requestAnimationFrame(frame);
    render(performance.now()); // 首帧同步出图，rAF 被节流时也有首屏画面
  }

    initFluid();
  }

  // ---------- 画布与粒子引擎（与演示页同一套已调优参数） ----------
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d'); // 透明画布：液态层透出作底色
  let W = 0, H = 0, DPR = 1;

  const dust = [];
  let particles = [];
  let enterT0 = 0; // 入场聚合动画的时间基准（buildParticles(scatter=true) 时刷新）

  const mouse = { x: -9999, y: -9999, active: false };

  const SPRING = 0.025, DAMPING = 0.92, MOUSE_R = 130, MOUSE_F = 0.55;
  const MAX_PARTICLES = 9000;

  function makeSprite(rgb) {
    const s = 32;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0.00, 'rgba(' + rgb + ',1)');
    grad.addColorStop(0.30, 'rgba(' + rgb + ',0.9)');
    grad.addColorStop(0.62, 'rgba(' + rgb + ',0.22)');
    grad.addColorStop(1.00, 'rgba(' + rgb + ',0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
    return c;
  }
  const SPRITES = [makeSprite('255,255,255'), makeSprite('190,228,255'), makeSprite('126,206,244')];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function initDust() {
    dust.length = 0;
    const n = Math.round(W * H / 16000);
    for (let i = 0; i < n; i++) {
      dust.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.06, vy: -0.02 - Math.random() * 0.08,
        s: Math.random() < 0.8 ? 1 : 1.6, a: 0.12 + Math.random() * 0.3,
        tw: Math.random() * Math.PI * 2, ts: 0.5 + Math.random() * 1.5,
        c: Math.random() < 0.7 ? 'rgba(255,255,255,0.9)' : 'rgba(150,205,255,0.9)'
      });
    }
  }

  function makeParticle(hx, hy, gap, scatter) {
    const jx = hx + (Math.random() - 0.5) * gap * 0.5;
    const jy = hy + (Math.random() - 0.5) * gap * 0.5;
    const p = {
      hx: jx, hy: jy, x: jx, y: jy, vx: 0, vy: 0,
      spr: Math.random() < 0.5 ? 0 : (Math.random() < 0.7 ? 1 : 2),
      size: 1.5 + Math.random() * 1.9,
      base: 0.65 + Math.random() * 0.35,
      tw: Math.random() * Math.PI * 2, ts: 0.6 + Math.random() * 1.6,
      fly: false
    };
    if (scatter) {
      // 入场：弥散「星尘云」覆盖视口中央大片区域，再整体收拢聚合（对齐品牌视频）
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.sqrt(Math.random()); // 盘内均匀分布
      const sx = W * 0.46 + Math.cos(ang) * rad * W * 0.52;
      const sy = H * 0.46 + Math.sin(ang) * rad * H * 0.46;
      const dx = jx - sx, dy = jy - sy;
      const dl = Math.hypot(dx, dy) || 1;
      p.fly = true;
      p.sx = sx; p.sy = sy;
      p.x = sx; p.y = sy;
      p.delay = Math.min(dl * 0.3, 400) + Math.random() * 120; // 远处先出发、协调到达
      p.dur = 900 + Math.random() * 350;
      p.pdx = -dy / dl; p.pdy = dx / dl;   // 飞行路径的垂直方向（轻微摆动用）
      p.swA = (Math.random() - 0.5) * 26;
      p.swF = 0.8 + Math.random() * 1.4;
    }
    return p;
  }

  // Logo 落点：宽屏在登录卡左侧可用区域内「水平 + 垂直」双居中，且完整显示（不超出屏幕、不被卡片遮挡）。
  // 卡片左边界按 .panel 的 right:8% / width:362px 换算，再留 60px 间距；窄屏放上方居中
  function logoRect(iw, ih) {
    const wide = W >= 1000;
    let lw, lh, ox, oy;
    if (wide) {
      const regionW = Math.max(200, W * 0.92 - 362 - 60);
      lw = Math.min(regionW * 0.86, W * 0.5, 1080);
      lh = lw * ih / iw;
      const maxH = H * 0.7;
      if (lh > maxH) { lh = maxH; lw = lh * iw / ih; }
      lw = Math.round(lw); lh = Math.round(lh);
      ox = Math.round((regionW - lw) / 2 + regionW * 0.05);   // 水平：区域内居中后整体略右移
      oy = Math.round((H - lh) / 2);         // 垂直：窗口居中（去掉旧版上移偏移）
    } else {
      lw = W * 0.78;
      lh = lw * ih / iw;
      const maxH = H * 0.34;
      if (lh > maxH) { lh = maxH; lw = lh * iw / ih; }
      lw = Math.round(lw); lh = Math.round(lh);
      ox = Math.round((W - lw) / 2);
      oy = Math.round(H * 0.09);
    }
    return { lw, lh, ox, oy };
  }

  function buildParticles(scatter) {
    const iw = img.naturalWidth || 354.6;
    const ih = img.naturalHeight || 114.83;
    const r = logoRect(iw, ih);

    const sc = document.createElement('canvas');
    sc.width = r.lw; sc.height = r.lh;
    const sg = sc.getContext('2d');
    sg.drawImage(img, 0, 0, r.lw, r.lh);
    let data;
    try {
      data = sg.getImageData(0, 0, r.lw, r.lh).data;
    } catch (e) {
      console.error('读取像素失败', e);
      return;
    }

    let gap = Math.max(2, Math.round(r.lw / 300));
    if (scatter) enterT0 = performance.now();
    for (let tries = 0; tries < 6; tries++) {
      particles = [];
      for (let y = 0; y < r.lh; y += gap) {
        for (let x = 0; x < r.lw; x += gap) {
          if (data[(y * r.lw + x) * 4 + 3] > 130) {
            particles.push(makeParticle(r.ox + x, r.oy + y, gap, scatter));
          }
        }
      }
      if (particles.length <= MAX_PARTICLES) break;
      gap++;
    }
  }

  function easeInOutCubic(k) {
    return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  }

  function step() {
    const now = performance.now();
    const mActive = mouse.active, mx = mouse.x, my = mouse.y;
    const r2 = MOUSE_R * MOUSE_R;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.fly) {
        // 入场聚合阶段：从星尘云起点缓动到回家点，期间不受弹簧/鼠标力
        let k = (now - enterT0 - p.delay) / p.dur;
        if (k <= 0) {
          p.x = p.sx; p.y = p.sy;
          continue;
        }
        if (k >= 1) {
          p.x = p.hx; p.y = p.hy;
          p.vx = 0; p.vy = 0;
          p.fly = false;
          continue;
        }
        const e = easeInOutCubic(k);
        const sw = Math.sin(e * Math.PI * p.swF) * p.swA * (1 - e);
        p.x = p.sx + (p.hx - p.sx) * e + p.pdx * sw;
        p.y = p.sy + (p.hy - p.sy) * e + p.pdy * sw;
        continue;
      }
      p.vx += (p.hx - p.x) * SPRING;
      p.vy += (p.hy - p.y) * SPRING;
      if (mActive) {
        const dx = mx - p.x, dy = my - p.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < r2 && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const f = (1 - d / MOUSE_R) * MOUSE_F;
          p.vx += dx / d * f;
          p.vy += dy / d * f;
        }
      }
      p.vx *= DAMPING; p.vy *= DAMPING;
      p.x += p.vx; p.y += p.vy;
    }
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      d.x += d.vx; d.y += d.vy;
      if (d.y < -4) { d.y = H + 4; d.x = Math.random() * W; }
      if (d.x < -4) d.x = W + 4; else if (d.x > W + 4) d.x = -4;
    }
  }

  function render(t) {
    ctx.clearRect(0, 0, W, H); // 背景由液态层提供，这里只画尘埃与粒子
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      const tw = 0.5 + 0.5 * Math.sin(t * 0.001 * d.ts + d.tw);
      ctx.globalAlpha = Math.min(1, d.a * (0.5 + 0.85 * tw));
      ctx.fillStyle = d.c;
      ctx.fillRect(d.x, d.y, d.s, d.s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    const breath = 0.9 + 0.28 * Math.sin(t * 0.0011);            // 整体呼吸（亮度）：幅度加大、更亮
    const breathS = 1 + 0.1 * Math.sin(t * 0.0011 + 0.6);       // 整体呼吸（尺寸微起伏）
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const tw = 0.78 + 0.38 * Math.sin(t * 0.003 * p.ts + p.tw); // 逐粒子闪亮（异频异相，下限抬高更亮）
      const jx = Math.sin(t * 0.0033 * p.ts + p.tw * 3.1) * 1.1; // 围绕落点的微跳动
      const jy = Math.cos(t * 0.0027 * p.ts + p.tw * 2.3) * 1.1;
      const s = p.size * (0.85 + 0.3 * tw) * breathS;
      ctx.globalAlpha = Math.min(1, p.base * tw * breath);
      ctx.drawImage(SPRITES[p.spr], p.x + jx - s / 2, p.y + jy - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function loop(t) {
    requestAnimationFrame(loop);
    step();
    render(t);
  }

  function setMouse(e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  }
  window.addEventListener('pointermove', setMouse);
  window.addEventListener('pointerdown', setMouse);
  document.addEventListener('mouseleave', function () { mouse.active = false; });
  window.addEventListener('blur', function () { mouse.active = false; });

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resize();
      initDust();
      if (img.complete && img.naturalWidth) buildParticles(false);
    }, 200);
  });

  resize();
  initDust();
  requestAnimationFrame(loop);

  const img = new Image();
  img.onload = function () { buildParticles(true); };
  img.src = LOGO_URI;

  /* ============================================================
   * 登录 / 注册逻辑
   * ============================================================ */
  const $ = function (s) { return document.querySelector(s); };
  const panel = $('#panel');

  // 选项卡切换
  const TITLES = {
    login: ['欢迎来到CyberNWT', '登录以进入项目展示'],
    register: ['创建账号', '注册一个新账号开始体验']
  };
  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      const name = btn.dataset.tab;
      $('#login-form').classList.toggle('active', name === 'login');
      $('#register-form').classList.toggle('active', name === 'register');
      $('#panel-title').textContent = TITLES[name][0];
      $('#panel-sub').textContent = TITLES[name][1];
    });
  });
  function switchTab(name) {
    document.querySelector('.tab[data-tab="' + name + '"]').click();
  }

  function setMsg(id, text, isError) {
    const el = $('#' + id);
    el.textContent = text || '';
    el.classList.toggle('err', !!isError);
    el.classList.toggle('ok', !isError && !!text);
  }

  function shake() {
    panel.classList.remove('shake');
    void panel.offsetWidth; // 重置动画
    panel.classList.add('shake');
  }

  async function api(path, body) {
    let res, data = {};
    try {
      res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      data = await res.json();
    } catch (e) {
      // file:// 直接打开或服务器未启动时走到这里
      return { status: 0, data: { ok: false, message: '无法连接服务器：请先运行 python server.py，再通过 http://127.0.0.1:8642 访问' } };
    }
    return { status: res.status, data: data || {} };
  }

  // ---- 登录 ----
  $('#login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const username = $('#login-user').value.trim();
    const password = $('#login-pass').value;
    setMsg('login-msg', '');
    if (!username || !password) { setMsg('login-msg', '请输入账号和密码', true); shake(); return; }

    const btn = $('#login-btn');
    btn.disabled = true; btn.textContent = '登录中…';
    const { status, data } = await api('/api/login', { username: username, password: password });
    btn.disabled = false; btn.textContent = '登 录';

    if (status === 200 && data.ok) {
      setMsg('login-msg', '登录成功，正在进入…');
      setTimeout(function () { location.href = 'home.html'; }, 350);
    } else {
      setMsg('login-msg', data.message || '登录失败', true);
      shake();
    }
  });

  // ---- 注册 ----
  $('#register-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const username = $('#reg-user').value.trim();
    const password = $('#reg-pass').value;
    const password2 = $('#reg-pass2').value;
    setMsg('reg-msg', '');

    if (!/^[\w\u4e00-\u9fff]{2,20}$/.test(username)) {
      setMsg('reg-msg', '账号需为 2-20 位字母、数字、下划线或中文', true); shake(); return;
    }
    if (password.length < 6) { setMsg('reg-msg', '密码至少 6 位', true); shake(); return; }
    if (password !== password2) { setMsg('reg-msg', '两次输入的密码不一致', true); shake(); return; }

    const btn = $('#reg-btn');
    btn.disabled = true; btn.textContent = '注册中…';
    const { status, data } = await api('/api/register', { username: username, password: password });
    btn.disabled = false; btn.textContent = '注 册';

    if (status === 200 && data.ok) {
      setMsg('reg-msg', '注册成功，请登录');
      $('#login-user').value = username;
      $('#login-pass').value = '';
      setTimeout(function () { switchTab('login'); $('#login-pass').focus(); }, 600);
    } else {
      setMsg('reg-msg', data.message || '注册失败', true);
      shake();
    }
  });
})();
</script>
</body>
