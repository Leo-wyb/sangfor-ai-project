<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="logo.png" />
<title>案例复盘 · CyberNWT</title>
<meta name="theme-color" content="#0A0A0A" />
<script>
// 首屏前确定主题，避免闪烁：localStorage 优先，否则跟随系统
(function () {
  var t = null;
  try { t = localStorage.getItem('cyber-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* ---------- 主题变量（深色为默认，浅色覆盖） ---------- */
  :root {
    color-scheme: dark;
    --bg: #0A0A0A;
    --grid-line: rgba(255, 255, 255, 0.06);
    --header-bg: rgba(16, 18, 22, 0.34);
    --border: rgba(205, 214, 224, 0.14);
    --panel: rgba(24, 30, 38, 0.86);
    --panel-border: rgba(205, 214, 224, 0.16);
    --panel-hover: rgba(38, 47, 58, 0.92);
    --text: #EDEDED;
    --text-2: #9CA3AF;
    --accent: #FFFFFF;
    --accent-contrast: #0A0A0A;
    --accent-bg: rgba(255, 255, 255, 0.06);
    --accent-border: rgba(255, 255, 255, 0.38);
    --accent-strong: rgba(255, 255, 255, 0.8);
    --chip-border: rgba(255, 255, 255, 0.20);
    --prog-track: rgba(255, 255, 255, 0.18);
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --blue: #7cbdf5; --green: #7ed37e; --warn: #f6c453; --orange: #ffa94d; --red: #ff8080;  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #dbe1e7;
    --grid-line: rgba(0, 0, 0, 0.07);
    --header-bg: rgba(216, 224, 231, 0.40);   /* 白天半透明银顶栏 */
    --border: rgba(0, 0, 0, 0.14);
    --panel: rgba(247, 250, 253, 0.45);   /* 白天磨砂银玻璃，透出背景液态银 */
    --panel-border: rgba(0, 0, 0, 0.14);
    --panel-hover: #F1F1F3;
    --text: #111111;
    --text-2: #52525B;
    --accent: #0A0A0A;
    --accent-contrast: #FAFAFA;
    --accent-bg: rgba(0, 0, 0, 0.05);
    --accent-border: rgba(0, 0, 0, 0.35);
    --accent-strong: rgba(0, 0, 0, 0.7);
    --chip-border: rgba(0, 0, 0, 0.18);
    --prog-track: rgba(0, 0, 0, 0.16);
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --blue: #0369a1; --green: #15803d; --warn: #b45309; --orange: #c2410c; --red: #dc2626;  }

  body {
    min-height: 100vh; color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: var(--bg);
    background-attachment: fixed;
    transition: background-color 0.3s, color 0.3s;
  }
  body::before {
    content: none;   /* 背景网格已去除：让液态金属/星尘背景完整呈现 */
  }

  /* ---------- 登录页移植：液态金属流体 + 星尘背景层 ---------- */
  .fx {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;   /* 置于全部页面内容之下 */
    transition: opacity 0.45s ease;
  }
  [data-theme="light"] .fx { opacity: 0.8; }   /* 浅色主题自动淡出，保留原浅色观感 */

  /* ---------- 顶栏（与 home.html 一致） ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 18px;
    padding: 0 36px; height: 62px;
    background: var(--header-bg);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    transition: background-color 0.3s, border-color 0.3s;
  }
  .logo { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; letter-spacing: 1px; font-family: var(--font-mono); }
  .logo .dot {
    display: block; width: auto; height: 14px; flex: none;
    border: none; user-select: none; -webkit-user-drag: none;
  }
  nav { display: flex; gap: 6px; flex: 1; }
  nav a {
    display: inline-flex; align-items: center;
    height: 32px; padding: 0 16px; border-radius: 6px; text-decoration: none;
    color: var(--text-2); font-size: 14px; transition: color 0.2s, background-color 0.2s;
  }
  nav a:hover { color: var(--text); background: var(--accent-bg); }
  nav a.active { color: var(--text); background: var(--accent-bg); font-weight: 600; }
  .user { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-2); }
  .user .chip {
    display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 12px; border-radius: 6px;
    background: var(--panel);
    border: 1px solid var(--border); color: var(--text);
  }
  .user .chip i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }
  .user .chip b { font-family: var(--font-mono); font-weight: 600; letter-spacing: 0.5px; font-size: 13px; line-height: 1; }
  .logout {
    display: inline-flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border);
    background: transparent; color: var(--text-2); font-size: 13px; line-height: 1;
    transition: color 0.2s, background-color 0.2s, border-color 0.2s;
    font-family: inherit;
  }
  .logout:hover { color: var(--text); background: var(--accent-bg); border-color: var(--accent-border); }
  .logout svg { width: 13px; height: 13px; flex: none; fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* 主题切换：分段式开关（太阳 / 月亮，随主题反转填充） */
  .tswitch {
    display: inline-flex; align-items: center; gap: 2px;
    height: 32px; padding: 2px;
    border-radius: 6px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--border); background: var(--panel);
    transition: border-color 0.3s, background-color 0.3s;
  }
  .tswitch:hover { border-color: var(--accent-border); }
  .tswitch .seg {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 4px;
    transition: background-color 0.2s;
  }
  .tswitch .seg:hover { background: var(--accent-bg); }
  .tswitch svg {
    width: 13px; height: 13px; fill: none;
    stroke: var(--text-2); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    transition: stroke 0.3s;
  }
  [data-theme="light"] .tswitch .seg-sun { background: var(--accent); }
  [data-theme="light"] .tswitch .seg-sun svg { stroke: var(--accent-contrast); }
  [data-theme="dark"] .tswitch .seg-moon { background: var(--accent); }
  [data-theme="dark"] .tswitch .seg-moon svg { stroke: var(--accent-contrast); }

  main { position: relative; max-width: 1220px; margin: 0 auto; padding: 36px 28px 36px;
    display: grid; grid-template-columns: 400px 1fr; gap: 18px; align-items: stretch; }
  .card {
    border-radius: 14px;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid color-mix(in srgb, var(--blue) 16%, transparent);
    padding: 22px 24px;
  }
  .card h2 { font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .card h2 .chip { font-size: 10.5px; font-weight: 400; color: var(--blue); border: 1px solid color-mix(in srgb, var(--blue) 40%, transparent);
    padding: 2px 9px; border-radius: 999px; letter-spacing: 1px; }
  .desc { font-size: 12.5px; color: var(--text-2); line-height: 1.8; margin: 10px 0 16px; }
  label.fld { display: block; font-size: 12.5px; color: var(--text-2); margin: 14px 0 7px; letter-spacing: 1px; }
  input.fld, textarea.fld {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--blue) 25%, transparent); background: color-mix(in srgb, var(--panel) 60%, transparent);
    color: var(--text); font-size: 13.5px; font-family: inherit; line-height: 1.7; outline: none;
    transition: border-color .15s;
  }
  input.fld:focus, textarea.fld:focus { border-color: color-mix(in srgb, var(--blue) 60%, transparent); }
  textarea.fld { resize: none; min-height: 170px; }
  .card.form { display: flex; flex-direction: column; }
  .card.form textarea.fld { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .stag {
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 12px;
    border: 1px solid color-mix(in srgb, var(--blue) 25%, transparent); background: transparent; color: var(--text-2); font-family: inherit;
    transition: all .15s;
  }
  .stag.on { color: var(--text); background: color-mix(in srgb, var(--blue) 16%, transparent); border-color: color-mix(in srgb, var(--blue) 60%, transparent); }
  .gen {
    width: 100%; margin-top: 20px; padding: 13px 0; border-radius: 11px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #1a56c4, #0f8a5f); color: #fff;
    font-size: 15px; font-weight: 700; letter-spacing: 2px; font-family: inherit; transition: all .2s;
  }
  .gen:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(26,86,196,.45); }
  .gen:disabled { opacity: .55; cursor: wait; }

  .report { min-height: 420px; display: flex; flex-direction: column;
    height: calc(100vh - 110px); max-height: calc(100vh - 110px); }
  .rep-head { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid color-mix(in srgb, var(--blue) 14%, transparent);
    padding-bottom: 14px; margin-bottom: 6px; }
  .rep-head .sp { flex: 1; }
  .act { padding: 7px 16px; border-radius: 9px; cursor: pointer; font-size: 12.5px; font-family: inherit;
    border: 1px solid color-mix(in srgb, var(--blue) 30%, transparent); background: transparent; color: var(--blue); transition: all .15s; }
  .act:hover { background: color-mix(in srgb, var(--blue) 10%, transparent); }
  .rep-body { flex: 1; overflow-y: auto; padding: 14px 6px 10px; }
  .rep-body::-webkit-scrollbar { width: 8px; }
  .rep-body::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--blue) 20%, transparent); border-radius: 4px; }
  .rep-body h1 { font-size: 20px; margin: 4px 0 14px; color: var(--text); }
  .rep-body h2 { font-size: 15.5px; margin: 22px 0 10px; color: var(--blue); padding-left: 10px;
    border-left: 3px solid #6FBA2C; line-height: 1.4; }
  .rep-body p { font-size: 13.5px; line-height: 2; color: var(--text); margin: 6px 0; }
  .rep-body ul { margin: 8px 0 8px 22px; }
  .rep-body li { font-size: 13.5px; line-height: 2; color: var(--text); }
  .rep-body blockquote { margin: 12px 0; padding: 10px 16px; border-radius: 8px;
    background: color-mix(in srgb, var(--green) 8%, transparent); border: 1px dashed color-mix(in srgb, var(--green) 40%, transparent);
    color: var(--green); font-size: 12.5px; line-height: 1.9; }
  .rep-body b { color: var(--text); }
  .rep-body table { border-collapse: collapse; width: 100%; margin: 12px 0; }
  .rep-body th, .rep-body td { border: 1px solid var(--border); padding: 7px 10px;
    font-size: 13px; line-height: 1.8; text-align: left; vertical-align: top; }
  .rep-body th { background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--text); font-weight: 600; }
  .rep-body td { color: var(--text); }
  .empty { color: var(--text-2); font-size: 13.5px; text-align: center; padding: 120px 20px; line-height: 2.2; }

  /* ---- 插入图片：报告内图片展示 + 编辑态按钮高亮 ---- */
  .rep-body img { max-width: 100%; border-radius: 8px; display: block; margin: 10px 0; border: 1px solid color-mix(in srgb, var(--blue) 25%, transparent); }
  /* 编辑 / 退出编辑 叠放在同一槽位（槽宽取二者较宽者），编辑态切换时按钮位置恒定不动 */
  .swap { display: inline-grid; }
  .swap .act { grid-area: 1 / 1; }
  .act.on { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }

  /* ---- 退出编辑确认对话框 ---- */
  .modal-mask { position: fixed; inset: 0; z-index: 99; display: none;
    align-items: center; justify-content: center;
    background: rgba(8, 20, 40, .45); backdrop-filter: blur(2px); }
  .modal-mask.show { display: flex; }
  .modal { width: 400px; max-width: calc(100vw - 48px); border-radius: 14px; padding: 24px 26px 20px;
    background: var(--panel); border: 1px solid color-mix(in srgb, var(--blue) 25%, transparent);
    box-shadow: 0 24px 60px rgba(4, 14, 32, .35); }
  .modal h3 { margin: 0 0 10px; font-size: 17px; color: var(--text); }
  .modal p { margin: 0 0 18px; font-size: 14px; line-height: 2; color: var(--text); }
  .modal-btns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .mbtn { padding: 9px 20px; border-radius: 9px; cursor: pointer; font-size: 13px; font-family: inherit;
    border: 1px solid color-mix(in srgb, var(--blue) 30%, transparent); background: transparent;
    color: var(--text); transition: all .15s; }
  .mbtn:hover { background: color-mix(in srgb, var(--blue) 10%, transparent); }
  .mbtn.primary { border: none; background: linear-gradient(135deg, #1a56c4, #0f8a5f); color: #fff; font-weight: 600; }
  .mbtn.plain { border-color: color-mix(in srgb, var(--red) 60%, transparent); color: var(--red);
    font-weight: 600; background: color-mix(in srgb, var(--red) 8%, transparent); }
  .mbtn.plain:hover { background: color-mix(in srgb, var(--red) 16%, transparent); border-color: var(--red); }

  footer { text-align: center; padding: 20px 0 30px; font-size: 12px; color: color-mix(in srgb, var(--text-2) 60%, transparent); }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }

  /* 打印 / 导出 PDF：仅输出报告卡片，白底黑字 */
  @media print {
    body { background: #fff !important; }
    body::before, header, footer, .card:not(.report), .rep-head .act { display: none !important; }
    main { display: block !important; padding: 0 !important; max-width: none !important; }
    .card.report { border: none !important; box-shadow: none !important; background: #fff !important; }
    .rep-head { border: none !important; }
    .rep-head h2 { color: #111 !important; }
    .rep-body { max-height: none !important; overflow: visible !important; }
    .rep-body * { color: #111 !important; }
    .rep-body h2 { color: #1b5e20 !important; }
  }
</style>
</head>
<body>
<canvas id="fluid" class="fx"></canvas>
<canvas id="stage" class="fx"></canvas>
<header>
  <div class="logo"><img class="dot" src="logo.png" alt="CyberNWT Logo">CyberNWT</div>
  <nav>
    <a href="home.html">首页</a>
      <a href="javascript:void(0)" data-cm-open>使用手册</a>
    <a href="https://bbs.sangfor.com.cn/plugin.php?id=info:index#?type=index" target="_blank" rel="noopener">深信服社区</a>
    <a href="https://prm.sangfor.com/" target="_blank" rel="noopener">PRM系统</a>
  </nav>
  <button class="tswitch" id="theme-toggle" aria-label="切换深浅色模式" title="切换深浅色模式" aria-pressed="false">
    <span class="seg seg-sun"><svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>
    <span class="seg seg-moon"><svg class="ic-moon" viewBox="0 0 24 24"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></span>
  </button>
  <div class="user">
    <span class="chip"><i></i><b id="username">…</b></span>
    <button class="logout" id="logout-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>退出登录</button>
  </div>
</header>

<main>
  <section class="card form">
    <h2>输入复盘材料 <span class="chip">STEP 1</span></h2>
    <p class="desc">把项目整个过程“讲给灵犀听”：背景、实施过程、遇到的问题和处置方式，越具体，报告越有洞察。AI 将自动沉淀为结构化复盘报告，提炼可复用的方法论。</p>

    <label class="fld">项目名称</label>
    <input class="fld" id="pname" placeholder="如：XX 客服中心 AF 防火墙割接上线" />

    <label class="fld">所属阶段（可多选）</label>
    <div class="chips" id="stages">
      <button class="stag" type="button">规划设计</button>
      <button class="stag" type="button">工程实施</button>
      <button class="stag" type="button">整机上架</button>
      <button class="stag" type="button">割接切换</button>
      <button class="stag" type="button">故障处置</button>
      <button class="stag" type="button">扩容优化</button>
      <button class="stag" type="button">测试验收</button>
      <button class="stag" type="button">培训交付</button>
    </div>

    <label class="fld">过程描述</label>
    <textarea class="fld" id="story" placeholder="示例：&#10;1. 周二晚 22:00 开始割接，先旁路接入 AF 观察了一天流量；&#10;2. 凌晨 1 点切串接后内网访问正常，但发现××业务会话异常中断；&#10;3. 排查发现是 ASBF 对长连接的会话超时配置与旧设备不一致…"></textarea>

    <button class="gen" id="gen-btn">✦ 生成复盘报告</button>
  </section>

  <section class="card report">
    <div class="rep-head">
      <h2 style="border:none;padding:0">复盘报告 <span class="chip">REPORT</span></h2>
      <span class="sp"></span>
      <button class="act" id="ins-btn" style="display:none" title="选择电脑中的图片插入到报告（未编辑时自动进入编辑）">插入图片</button>
      <span class="swap">
        <button class="act" id="copy-btn">编辑</button>
        <button class="act" id="dl-btn">退出编辑</button>
      </span>
      <button class="act" id="word-btn">下载 Word</button>
      <button class="act" id="pdf-btn">导出 PDF</button>
    </div>
    <div class="rep-body" id="rep-body">
      <div class="empty">左侧输入项目材料后点击「生成复盘报告」<br />AI 将从过程中提炼：时间线 · 问题根因 · 可复用方法论 · 改进项</div>
    </div>
  </section>
</main>

<div class="modal-mask" id="exit-mask">
  <div class="modal">
    <h3>退出编辑</h3>
    <p id="exit-msg">是否保存对报告的修改？</p>
    <div class="modal-btns">
      <button class="mbtn plain" id="exit-cancel" type="button">取消</button>
      <span style="flex:1"></span>
      <button class="mbtn plain" id="exit-discard" type="button">不保存</button>
      <button class="mbtn primary" id="exit-save" type="button">确定并保存</button>
    </div>
  </div>
</div>

<script src="whiteboard.js" defer></script>
<script src="manual.js" defer></script>
<script src="bg-live.js"></script>
<script>
(function () {
  'use strict';

  /* 自绘提示框：替代浏览器原生 alert（观感统一，明暗随页面主题） */
  window.rvAlert = function (msg, title) {
    var dark = document.documentElement.getAttribute('data-theme') !== 'light';
    var C = dark
      ? { mask: 'rgba(4,10,20,.55)', bg: '#0b1626', border: '#5aa7e8', text: '#e8f2ff', sub: '#9fb0c3' }
      : { mask: 'rgba(120,145,170,.35)', bg: '#ffffff', border: 'rgba(29,111,196,.55)', text: '#1c3550', sub: '#5a6b7d' };
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:10000;background:' + C.mask + ';display:flex;align-items:center;justify-content:center;';
    var card = document.createElement('div');
    card.style.cssText = 'background:' + C.bg + ';border:1px solid ' + C.border + ';border-radius:12px;padding:20px 22px;width:430px;max-width:92vw;' +
      'box-shadow:0 16px 44px rgba(0,0,0,.35);color:' + C.text + ';font:13px/1.9 \"Microsoft YaHei\",sans-serif;';
    card.innerHTML = '<div style="font-size:15px;font-weight:700;margin-bottom:6px">' + (title || '提示') + '</div>' +
      '<div style="color:' + C.sub + ';margin-bottom:14px;white-space:pre-wrap">' + String(msg) + '</div>';
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;justify-content:flex-end;';
    var ok = document.createElement('button');
    ok.type = 'button'; ok.textContent = '确定';
    ok.style.cssText = 'padding:8px 22px;border:none;border-radius:8px;cursor:pointer;background:linear-gradient(135deg,#1a56c4,#0f8a5f);color:#fff;font:600 12.5px/1.2 inherit;';
    ok.addEventListener('click', function () { ov.remove(); });
    row.appendChild(ok); card.appendChild(row); ov.appendChild(card);
    document.body.appendChild(ov);
    ok.focus();
  };


  'use strict';

  // ---------- 深浅色模式切换 ----------
  var rootEl = document.documentElement;
  var themeBtn = document.getElementById('theme-toggle');
  var THEME_COLORS = { dark: '#0A0A0A', light: '#FAFAFA' };
  function setTheme(t) {
    rootEl.setAttribute('data-theme', t);
    themeBtn.setAttribute('aria-pressed', t === 'light' ? 'true' : 'false');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME_COLORS[t]);
  }
  setTheme(rootEl.getAttribute('data-theme'));
  themeBtn.addEventListener('click', function () {
    var next = rootEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    setTheme(next);
    try { localStorage.setItem('cyber-theme', next); } catch (e) {}
  });
  // 用户未手动选择过主题时，跟随系统变化
  var schemeMq = matchMedia('(prefers-color-scheme: light)');
  (schemeMq.addEventListener ? schemeMq.addEventListener.bind(schemeMq, 'change')
                             : schemeMq.addListener.bind(schemeMq))(function (e) {
    var saved = null;
    try { saved = localStorage.getItem('cyber-theme'); } catch (err) {}
    if (saved !== 'light' && saved !== 'dark') {
      setTheme(e.matches ? 'light' : 'dark');
    }
  });

  fetch('/api/me').then(function (r) {
    if (r.status === 401) { location.href = 'login.html'; return null; }
    return r.json();
  }).then(function (data) {
    if (data && data.ok) document.getElementById('username').textContent = data.username;
  }).catch(function () { location.href = 'login.html'; });
  document.getElementById('logout-btn').addEventListener('click', function () {
    fetch('/api/logout', { method: 'POST' }).then(function () { location.href = 'login.html'; });
  });

  var $ = function (s) { return document.querySelector(s); };
  var lastRaw = '';

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function md(src) {
    var lines = esc(src).split('\n');
    var out = [], inUl = false, inTable = false, tRows = [];
    function closeUl() { if (inUl) { out.push('</ul>'); inUl = false; } }
    function closeTable() {
      if (!inTable) return;
      inTable = false;
      if (!tRows.length) return;
      var t = ['<table>'];
      tRows.forEach(function (cells, ri) {
        t.push('<tr>');
        cells.forEach(function (c) { t.push(ri === 0 ? '<th>' + c + '</th>' : '<td>' + c + '</td>'); });
        t.push('</tr>');
      });
      t.push('</table>');
      out.push(t.join(''));
      tRows = [];
    }
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      var fmt = ln.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">')
                  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
      /* Markdown 表格行：| a | b |（分隔行 | --- | --- | 跳过） */
      if (/^\s*\|.*\|\s*$/.test(ln)) {
        if (/^\s*\|[\s:\-|]+\|\s*$/.test(ln)) continue;
        closeUl();
        var cells = ln.trim().replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) {
          return c.trim().replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
        });
        if (!inTable) { inTable = true; tRows = []; }
        tRows.push(cells);
        continue;
      }
      closeTable();
      if (/^##\s+/.test(ln)) {
        closeUl();
        out.push('<h2>' + fmt.replace(/^##\s+/, '') + '</h2>'); continue;
      }
      if (/^#\s+/.test(ln)) {
        closeUl();
        out.push('<h1>' + fmt.replace(/^#\s+/, '') + '</h1>'); continue;
      }
      if (/^>\s?/.test(ln)) {
        out.push('<blockquote>' + fmt.replace(/^>\s?/, '') + '</blockquote>'); continue;
      }
      if (/^\s*[-*]\s+/.test(ln)) {
        if (!inUl) { out.push('<ul>'); inUl = true; }
        out.push('<li>' + fmt.replace(/^\s*[-*]\s+/, '') + '</li>'); continue;
      }
      closeUl();
      if (!ln.trim()) continue;
      out.push('<p>' + fmt + '</p>');
    }
    closeTable();
    if (inUl) out.push('</ul>');
    return out.join('');
  }

  /* 打字机流式输出 Markdown 源文，结束后整体渲染 */
  function typewrite(raw, done) {
    var body = $('#rep-body');
    var i = 0;
    var timer = setInterval(function () {
      i = Math.min(raw.length, i + 4);
      body.innerHTML = '<pre style="white-space:pre-wrap;font:12.5px/1.9 Consolas,monospace;color:#9db8d4">' +
        esc(raw.slice(0, i)) + '</pre>';
      body.scrollTop = body.scrollHeight;
      if (i >= raw.length) {
        clearInterval(timer);
        body.innerHTML = md(raw);
        done && done();
      }
    }, 12);
  }

  document.querySelectorAll('.stag').forEach(function (b) {
    b.addEventListener('click', function () { b.classList.toggle('on'); });
  });

  function generate() {
    if (editing) { editing = false; setEditBtns(); }   // 重新生成时退出编辑态
    var pname = $('#pname').value.trim();
    var story = $('#story').value.trim();
    if (!story) { rvAlert('请先填写过程描述 —— 这是 AI 提炼报告的核心材料。'); return; }
    var stages = [];
    document.querySelectorAll('.stag.on').forEach(function (b) { stages.push(b.textContent); });

    var btn = $('#gen-btn');
    btn.disabled = true; btn.textContent = '◌ 灵犀正在复盘…';
    var prompt = ['【项目名称】' + (pname || '未命名项目'),
      stages.length ? '【所属阶段】' + stages.join('、') : '',
      '【项目过程】', story].filter(Boolean).join('\n');

    /* 流式生成：报告边生成边显示（约 2 秒出第一句），结束整体渲染为富文本 */
    fetch('/api/ai/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scene: 'review', stream: true, messages: [{ role: 'user', content: prompt }] })
    }).then(function (r) {
      if (!r.ok || !r.body) throw new Error('服务异常');
      var reader = r.body.getReader();
      var dec = new TextDecoder('utf-8');
      var buf = '', raw = '', info = null, finished = false, full = '';
      var repBody = $('#rep-body');
      function paint() {
        repBody.innerHTML = '<pre style="white-space:pre-wrap;font:12.5px/1.9 Consolas,monospace;color:#9db8d4">' +
          esc(raw) + '</pre>';
        repBody.scrollTop = repBody.scrollHeight;
      }
      function doneCb() {
        try { localStorage.setItem('cybernwt.lastreport.v2', JSON.stringify({ raw: full, name: pname })); } catch (e) {}
        btn.disabled = false; btn.textContent = '✦ 生成复盘报告';
        setEditBtns();   // 报告就绪，亮出「插入图片」按钮
      }
      function fin() {
        if (finished) return;
        finished = true;
        full = (info && info.reply) || raw;
        lastRaw = full;
        if (raw === full) {          // 流式已展示过源文：直接整体渲染
          repBody.innerHTML = md(full);
          repBody.scrollTop = repBody.scrollHeight;
          doneCb();
        } else {                     // 回退 / 演示内容一次性到达：沿用打字机
          typewrite(full, doneCb);
        }
      }
      function handleFrame(frame) {
        var ev = '', ds = '';
        frame.split('\n').forEach(function (ln) {
          if (ln.indexOf('event:') === 0) ev = ln.slice(6).trim();
          else if (ln.indexOf('data:') === 0) ds += ln.slice(5).trim();
        });
        if (!ds) return;
        var obj;
        try { obj = JSON.parse(ds); } catch (e) { return; }
        if (ev === 'delta' && obj.t) { raw += obj.t; paint(); }
        else if (ev === 'done') { info = obj; }
      }
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) { fin(); return; }
          buf += dec.decode(res.value, { stream: true });
          var i;
          while ((i = buf.indexOf('\n\n')) >= 0) {
            handleFrame(buf.slice(0, i));
            buf = buf.slice(i + 2);
          }
          return pump();
        });
      }
      pump().catch(function (e) { throw e; });
    }).catch(function (e) {
      rvAlert('生成失败：' + (e.message || e));
      btn.disabled = false; btn.textContent = '✦ 生成复盘报告';
    });
  }

  $('#gen-btn').addEventListener('click', generate);

  /* ---- 报告编辑：点「编辑」进入，点「退出编辑」三选（保存 / 不保存 / 取消） ---- */
  var editing = false;
  var editBtn = $('#copy-btn');
  var exitBtn = $('#dl-btn');
  var swapEl = document.querySelector('.swap');   // 编辑 / 退出编辑 的共同槽位
  var repBody = $('#rep-body');
  var lastCaret = null;   // 编辑区光标位置（点击「插入图片」后图片落到这里）
  var imgMap = {};        // 编辑态图片占位符 #img:N → data URL（保存时还原，编辑区不出现 base64 长串）
  var imgSeq = 0;

  function setEditBtns() {
    // 槽位固定：「插入图片」恒居左，「编辑/退出编辑」叠放同一槽位——编辑态切换只换字不挪位
    var hasReport = !!lastRaw;
    [editBtn, insBtn, exitBtn, swapEl].forEach(function (b) { b.style.display = hasReport ? '' : 'none'; });
    editBtn.style.visibility = (hasReport && !editing) ? 'visible' : 'hidden';
    exitBtn.style.visibility = (hasReport && editing) ? 'visible' : 'hidden';
    insBtn.classList.toggle('on', editing);           // 编辑态高亮，提示插入将进入正文
  }

  function enterEdit() {
    if (!lastRaw || editing) return;
    editing = true;
    var ta = document.createElement('textarea');
    ta.id = 'md-editor';
    // 图片 data URL 换成短占位符（#img:N），编辑区不再出现成片 base64
    ta.value = lastRaw.replace(/(!\[[^\]]*\]\()(data:[^)]+)\)/g, function (m, head, url) {
      var key = '#img:' + (++imgSeq);
      imgMap[key] = url;
      return head + key + ')';
    });
    ta.style.cssText = 'width:100%;min-height:' + Math.max(300, repBody.clientHeight - 20) + 'px;' +
      'box-sizing:border-box;padding:14px 16px;border:1px solid color-mix(in srgb,var(--blue) 35%,transparent);' +
      'border-radius:10px;background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--text);' +
      'font:12.5px/1.9 Consolas,monospace;outline:none;resize:none;';
    repBody.innerHTML = '';
    repBody.appendChild(ta);
    ta.focus();
    try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}   // 光标默认落正文末尾
    lastCaret = [ta.value.length, ta.value.length];
    ['keyup', 'click', 'select', 'input', 'blur'].forEach(function (ev) {
      ta.addEventListener(ev, function () { lastCaret = [ta.selectionStart, ta.selectionEnd]; });
    });
    setEditBtns();
  }

  function saveEdit() {
    var ta = $('#md-editor');
    if (!ta) return;
    // 占位符还原为真实 data URL，预览/导出/缓存均带完整图片
    lastRaw = ta.value.replace(/!\[([^\]]*)\]\(#(img:\d+)\)/g, function (m, alt, id) {
      var u = imgMap['#' + id];
      return u ? '![' + alt + '](' + u + ')' : m;
    });
    repBody.innerHTML = md(lastRaw);
    try { localStorage.setItem('cybernwt.lastreport.v2',
      JSON.stringify({ raw: lastRaw, name: $('#pname').value.trim() })); } catch (e) {}
  }

  function exitEdit(saved) {
    var ta = $('#md-editor');
    if (!ta) { editing = false; setEditBtns(); return; }
    if (saved) {
      saveEdit();
    } else {
      repBody.innerHTML = md(lastRaw);  // 放弃修改，回到进入编辑前的内容
    }
    editing = false;
    setEditBtns();
  }

  editBtn.addEventListener('click', enterEdit);
  exitBtn.addEventListener('click', function () {
    if (!editing) return;
    var changed = $('#md-editor') && $('#md-editor').value !== lastRaw;
    $('#exit-msg').innerHTML = changed
      ? '报告内容已修改，请选择：<br>「确定并保存」—— 保存修改并退出编辑；<br>「不保存」—— 放弃本次全部修改；<br>「取消」—— 返回继续编辑。'
      : '内容尚未修改，请选择：<br>「确定并保存」—— 退出编辑；<br>「取消」—— 返回继续编辑。';
    $('#exit-discard').style.display = changed ? '' : 'none';
    $('#exit-mask').classList.add('show');
  });
  $('#exit-cancel').addEventListener('click', function () { $('#exit-mask').classList.remove('show'); });
  $('#exit-mask').addEventListener('click', function (e) {
    if (e.target === this) $('#exit-mask').classList.remove('show');  // 点遮罩 = 误点，继续编辑
  });
  $('#exit-save').addEventListener('click', function () {
    $('#exit-mask').classList.remove('show');
    exitEdit(true);
  });
  $('#exit-discard').addEventListener('click', function () {
    $('#exit-mask').classList.remove('show');
    exitEdit(false);
  });

  /* ---- 插入图片：选择电脑中的图片插入报告 ----
     未编辑时点击 → 自动进入编辑再选图；编辑中点击 → 图片插入光标所在位置。
     图片以 Markdown 语法（![]()）写入正文，保存后预览/导出均含图片。 ---- */
  var insBtn = $('#ins-btn');
  var imgInput = document.createElement('input');
  imgInput.type = 'file';
  imgInput.accept = 'image/*';
  imgInput.style.display = 'none';
  document.body.appendChild(imgInput);

  insBtn.addEventListener('click', function () {
    if (!lastRaw) { rvAlert('请先生成复盘报告，再插入图片。'); return; }
    if (!editing) enterEdit();   // 自动进入编辑（编辑/退出按钮随之切换）
    var ta = $('#md-editor');
    if (ta && lastCaret) {       // 回到上次光标位置再弹文件选择
      ta.focus();
      try { ta.setSelectionRange(lastCaret[0], lastCaret[1]); } catch (e) {}
    }
    imgInput.value = '';
    imgInput.click();
  });
  imgInput.addEventListener('change', function () {
    var f = imgInput.files && imgInput.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { rvAlert('请选择图片文件（PNG / JPG / GIF / WebP）。'); return; }
    insertImageFile(f);
  });

  function insertImageFile(f) {
    var ta = $('#md-editor');
    if (!ta) return;
    var name = (f.name || '').replace(/[\[\]()"]/g, '');   // 保留扩展名（如 .png），仅去掉易破坏语法的字符
    var apply = function (dataUrl) {
      var key = '#img:' + (++imgSeq);      // 编辑区只放短占位符，data URL 存内存映射
      imgMap[key] = dataUrl;
      var snap = '![' + (name ? '图片 · ' + name : '图片') + '](' + key + ')';
      var s = lastCaret ? lastCaret[0] : ta.value.length;
      var e = lastCaret ? lastCaret[1] : s;
      var before = ta.value.slice(0, s), after = ta.value.slice(e);
      var nl1 = before && !/\n$/.test(before) ? '\n\n' : '';
      var nl2 = after && after.charAt(0) !== '\n' ? '\n\n' : '\n';
      ta.value = before + nl1 + snap + nl2 + after;
      var caret = (before + nl1 + snap).length;
      ta.focus();
      try { ta.setSelectionRange(caret, caret); } catch (err) {}
      lastCaret = [caret, caret];
    };
    if (f.size <= 300 * 1024) {
      var rd = new FileReader();
      rd.onload = function () { apply(rd.result); };
      rd.readAsDataURL(f);
    } else {
      // 大图先压缩（最长边 ≤1400px / JPEG 85%），避免 base64 撑爆本地缓存
      var rd2 = new FileReader();
      rd2.onload = function () {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 1400 / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * scale));
          c.height = Math.max(1, Math.round(img.height * scale));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          apply(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = function () { rvAlert('图片读取失败，请换一张试试。'); };
        img.src = rd2.result;
      };
      rd2.readAsDataURL(f);
    }
  }
  // 导出 Word：以 Word 兼容 HTML 打包 .doc（无需联网组件，Word/WPS 均可打开）
  $('#word-btn').addEventListener('click', function () {
    if (!lastRaw) return;
    if (editing) { rvAlert('请先退出编辑（保存或放弃修改）后再导出。'); return; }
    var title = ($('#pname').value.trim() || '复盘报告');
    var body = $('#rep-body').innerHTML;
    var doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">' +
      '<head><meta charset="utf-8"><title>' + title + '</title>' +
      '<style>body{font-family:"Microsoft YaHei",sans-serif;font-size:12pt;color:#111;line-height:1.7;}' +
      'h1{font-size:20pt;margin:6pt 0;}h2{font-size:15pt;margin:14pt 0 6pt;border-left:4px solid #1b5e20;padding-left:8px;}' +
      'table{border-collapse:collapse;width:100%;margin:8pt 0;}td,th{border:1px solid #888;padding:5pt 8pt;font-size:10.5pt;vertical-align:top;}' +
      'th{background:#f0f0f0;}blockquote{color:#555;margin:8pt 0;padding:6pt 12pt;border-left:3px solid #bbb;}' +
      'ul,ol{margin:6pt 0 6pt 20pt;}li{line-height:1.8;}</style></head>' +
      '<body><h1>' + title + '</h1>' + body + '</body></html>';
    var blob = new Blob(['\ufeff', doc], { type: 'application/msword' });
    var a = document.createElement('a');
    a.download = title + '.doc';
    a.href = URL.createObjectURL(blob);
    a.click();
    URL.revokeObjectURL(a.href);
  });
  // 导出 PDF：调用浏览器打印（另存为 PDF），打印时只输出报告
  $('#pdf-btn').addEventListener('click', function () {
    if (!lastRaw) { return; }
    if (editing) { rvAlert('请先退出编辑（保存或放弃修改）后再导出。'); return; }
    window.print();
  });

  /* 恢复上次报告（仅右侧预览，不回填项目名称，每次进入都从空白开始）；
     缓存键带 v2：旧版演示模板曾生成只有半截的报告，升级后不再恢复那份残缺缓存 */
  try {
    var saved = JSON.parse(localStorage.getItem('cybernwt.lastreport.v2') || 'null');
    if (saved && saved.raw) {
      lastRaw = saved.raw;
      $('#rep-body').innerHTML = md(saved.raw);
    }
  } catch (e) {}
  setEditBtns();   // 有缓存报告时亮出「插入图片」按钮
})();
</script>
