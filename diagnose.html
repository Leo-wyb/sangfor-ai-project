<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="logo.png" />
<title>故障诊断助手 · CyberNWT</title>
<meta name="theme-color" content="#0A0A0A" />
<script>
// 首屏前确定主题，避免闪烁：localStorage 优先，否则跟随系统
(function () {
  var t = null;
  try { t = localStorage.getItem('cyber-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* ---------- 主题变量（深色为默认，浅色覆盖） ---------- */
  :root {
    color-scheme: dark;
    --bg: #0A0A0A;
    --grid-line: rgba(255, 255, 255, 0.06);
    --header-bg: rgba(10, 10, 10, 0.84);
    --border: rgba(255, 255, 255, 0.14);
    --panel: #111111;
    --panel-border: rgba(255, 255, 255, 0.14);
    --panel-hover: #171717;
    --text: #EDEDED;
    --text-2: #9CA3AF;
    --accent: #FFFFFF;
    --accent-contrast: #0A0A0A;
    --accent-bg: rgba(255, 255, 255, 0.06);
    --accent-border: rgba(255, 255, 255, 0.38);
    --accent-strong: rgba(255, 255, 255, 0.8);
    --chip-border: rgba(255, 255, 255, 0.20);
    --prog-track: rgba(255, 255, 255, 0.18);
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --blue: #7cbdf5; --green: #7ed37e; --warn: #f6c453; --orange: #ffa94d; --red: #ff8080;  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #FAFAFA;
    --grid-line: rgba(0, 0, 0, 0.07);
    --header-bg: rgba(250, 250, 250, 0.86);
    --border: rgba(0, 0, 0, 0.14);
    --panel: #FFFFFF;
    --panel-border: rgba(0, 0, 0, 0.14);
    --panel-hover: #F1F1F3;
    --text: #111111;
    --text-2: #52525B;
    --accent: #0A0A0A;
    --accent-contrast: #FAFAFA;
    --accent-bg: rgba(0, 0, 0, 0.05);
    --accent-border: rgba(0, 0, 0, 0.35);
    --accent-strong: rgba(0, 0, 0, 0.7);
    --chip-border: rgba(0, 0, 0, 0.18);
    --prog-track: rgba(0, 0, 0, 0.16);
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --blue: #0369a1; --green: #15803d; --warn: #b45309; --orange: #c2410c; --red: #dc2626;  }

  body {
    min-height: 100vh; color: var(--text); display: flex; flex-direction: column;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: var(--bg);
    background-attachment: fixed;
    transition: background-color 0.3s, color 0.3s;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 46px 46px;
  }

  /* ---------- 顶栏（与 home.html 一致） ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 18px;
    padding: 0 36px; height: 62px;
    background: var(--header-bg);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    transition: background-color 0.3s, border-color 0.3s;
  }
  .logo { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; letter-spacing: 1px; font-family: var(--font-mono); }
  .logo .dot {
    display: block; width: auto; height: 14px; flex: none;
    border: none; user-select: none; -webkit-user-drag: none;
  }
  nav { display: flex; gap: 6px; flex: 1; }
  nav a {
    display: inline-flex; align-items: center;
    height: 32px; padding: 0 16px; border-radius: 6px; text-decoration: none;
    color: var(--text-2); font-size: 14px; transition: color 0.2s, background-color 0.2s;
  }
  nav a:hover { color: var(--text); background: var(--accent-bg); }
  nav a.active { color: var(--text); background: var(--accent-bg); font-weight: 600; }
  .user { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-2); }
  .user .chip {
    display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 12px; border-radius: 6px;
    background: var(--panel);
    border: 1px solid var(--border); color: var(--text);
  }
  .user .chip i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }
  .user .chip b { font-family: var(--font-mono); font-weight: 600; letter-spacing: 0.5px; font-size: 13px; line-height: 1; }
  .logout {
    display: inline-flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border);
    background: transparent; color: var(--text-2); font-size: 13px; line-height: 1;
    transition: color 0.2s, background-color 0.2s, border-color 0.2s;
    font-family: inherit;
  }
  .logout:hover { color: var(--text); background: var(--accent-bg); border-color: var(--accent-border); }
  .logout svg { width: 13px; height: 13px; flex: none; fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* 主题切换：分段式开关（太阳 / 月亮，随主题反转填充） */
  .tswitch {
    display: inline-flex; align-items: center; gap: 2px;
    height: 32px; padding: 2px;
    border-radius: 6px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--border); background: var(--panel);
    transition: border-color 0.3s, background-color 0.3s;
  }
  .tswitch:hover { border-color: var(--accent-border); }
  .tswitch .seg {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 4px;
    transition: background-color 0.2s;
  }
  .tswitch .seg:hover { background: var(--accent-bg); }
  .tswitch svg {
    width: 13px; height: 13px; fill: none;
    stroke: var(--text-2); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    transition: stroke 0.3s;
  }
  [data-theme="light"] .tswitch .seg-sun { background: var(--accent); }
  [data-theme="light"] .tswitch .seg-sun svg { stroke: var(--accent-contrast); }
  [data-theme="dark"] .tswitch .seg-moon { background: var(--accent); }
  [data-theme="dark"] .tswitch .seg-moon svg { stroke: var(--accent-contrast); }

  main { position: relative; max-width: 1180px; margin: 0 auto; padding: 28px 28px 10px;
    display: grid; grid-template-columns: 330px 1fr; gap: 18px; align-items: stretch; }
  .card {
    border-radius: 14px;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid color-mix(in srgb, var(--blue) 16%, transparent);
  }
  .side { padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .side > div { flex: 1; display: flex; flex-direction: column; }
  .side h3 { font-size: 13px; color: var(--text-2); letter-spacing: 2px; font-weight: 400; }
  .scene {
    display: flex; flex-direction: column; justify-content: center;
    flex: 1; min-height: 56px; text-align: left; cursor: pointer;
    padding: 10px 14px; border-radius: 10px; margin-top: 8px;
    border: 1px solid color-mix(in srgb, var(--blue) 16%, transparent); background: color-mix(in srgb, var(--blue) 5%, transparent);
    color: var(--text); font-size: 13.5px; font-family: inherit; transition: all 0.18s;
  }
  .scene:hover { background: color-mix(in srgb, var(--blue) 13%, transparent); border-color: color-mix(in srgb, var(--blue) 45%, transparent); transform: translateX(3px); }
  .scene small { display: block; color: var(--text-2); font-size: 11.5px; margin-top: 3px; }
  .ghost {
    padding: 9px 0; border-radius: 9px; cursor: pointer; width: 100%; flex-shrink: 0;
    border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); background: transparent;
    color: var(--red); font-size: 13px; font-family: inherit; transition: all 0.15s;
  }
  .ghost:hover { background: color-mix(in srgb, var(--red) 10%, transparent); }

  /* 聊天区 */
  .chat { display: flex; flex-direction: column; height: calc(100vh - 142px); min-height: 520px; }
  .chat-head { display: flex; align-items: center; gap: 12px; padding: 15px 20px;
    border-bottom: 1px solid color-mix(in srgb, var(--blue) 14%, transparent); }
  .chat-head .hint2 { margin-left: auto; text-align: right; font-size: 11px;
    color: var(--text-2); line-height: 1.5; white-space: nowrap; flex-shrink: 0; }
  .chat-head > div:not(.avatar):not(.hint2) { min-width: 0; }
  .avatar { width: 40px; height: 40px; border-radius: 12px; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    background: linear-gradient(135deg, rgba(26,86,196,.5), color-mix(in srgb, var(--green) 50%, transparent));
    border: 1px solid color-mix(in srgb, var(--blue) 35%, transparent); }
  .chat-head b { font-size: 15px; display: block; }
  .chat-head small { color: var(--text-2); font-size: 12px; }

  .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msgs::-webkit-scrollbar { width: 8px; }
  .msgs::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--blue) 20%, transparent); border-radius: 4px; }
  .msg { display: flex; gap: 10px; max-width: 86%; }
  .msg .bub {
    padding: 12px 16px; border-radius: 13px; font-size: 13.5px; line-height: 1.85;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.ai .bub { background: color-mix(in srgb, var(--blue) 8%, transparent); border: 1px solid color-mix(in srgb, var(--blue) 16%, transparent);
    border-top-left-radius: 4px; }
  .msg.ai .bub b { color: var(--blue); }
  .msg.ai .bub code { background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 1px 7px; border-radius: 5px;
    font-family: Consolas, monospace; font-size: 12.5px; color: var(--green); }
  .msg.me { align-self: flex-end; }
  .msg.me .bub { background: linear-gradient(135deg, rgba(26,86,196,.55), color-mix(in srgb, var(--green) 45%, transparent));
    border-top-right-radius: 4px; }
  .msg .mini { width: 30px; height: 30px; border-radius: 9px; flex: none; margin-top: 2px;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    background: color-mix(in srgb, var(--blue) 10%, transparent); border: 1px solid color-mix(in srgb, var(--blue) 25%, transparent); }
  .msg.me .mini { order: 2; background: color-mix(in srgb, var(--green) 20%, transparent); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); opacity: .4;
    animation: blink 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 50% { opacity: 1; transform: translateY(-2px); } }

  /* ---- 深度思考面板：等待时展开，回复后自动收起 ---- */
  .think { margin: -2px 0 10px; padding: 2px 0 2px 11px;
    border-left: 2px solid color-mix(in srgb, var(--blue) 38%, transparent); }
  .think-head { display: flex; align-items: center; gap: 7px; font-size: 12px;
    color: var(--blue); user-select: none; -webkit-user-select: none; }
  .think.done .think-head { cursor: pointer; }
  .think-time { font-size: 11px; color: var(--text-2); }
  .think-toggle { font-size: 11px; color: var(--text-2); }
  .think-dots { display: inline-flex; gap: 3px; margin-left: 2px; }
  .think-dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--blue);
    opacity: .4; animation: blink 1.1s infinite; }
  .think-dots i:nth-child(2) { animation-delay: .18s; }
  .think-dots i:nth-child(3) { animation-delay: .36s; }
  .think.done .think-dots { display: none; }
  .think-body { max-height: 420px; overflow: hidden;
    transition: max-height .35s ease, opacity .3s ease; }
  .think.done:not(.open) .think-body { max-height: 0; opacity: 0; }
  .think-step { font-size: 12px; color: var(--text-2); line-height: 1.9;
    animation: thinkIn .3s ease; }
  .think-step::before { content: "› "; color: var(--blue); }
  @keyframes thinkIn { from { opacity: 0; transform: translateY(3px); } }

  /* ---- 回答内表格 / 标题 ---- */
  .msg.ai .bub .md-h { font-weight: 700; color: var(--blue); margin: 10px 0 4px; font-size: 13.5px; }
  .msg.ai .bub table { border-collapse: collapse; margin: 8px 0; max-width: 100%; }
  .msg.ai .bub th, .msg.ai .bub td { border: 1px solid color-mix(in srgb, var(--blue) 25%, transparent);
    padding: 6px 9px; font-size: 12.5px; line-height: 1.6; text-align: left; vertical-align: top; }
  .msg.ai .bub th { background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--blue); font-weight: 600; }

  /* ---- 排查清单导出 Excel ---- */
  .xl-btn { display: inline-flex; align-items: center; gap: 6px; margin: 6px 0 10px; padding: 7px 16px;
    border-radius: 9px; cursor: pointer; font-size: 12.5px; font-family: inherit;
    border: 1px solid color-mix(in srgb, var(--green) 35%, transparent); background: transparent;
    color: var(--green); transition: all .15s; }
  .xl-btn:hover { background: color-mix(in srgb, var(--green) 10%, transparent); }

  /* ---- 追问：补充信息卡片 ---- */
  .ask { margin-top: 12px; padding: 12px 14px; border-radius: 11px;
    background: color-mix(in srgb, var(--warn) 7%, transparent);
    border: 1px dashed color-mix(in srgb, var(--warn) 45%, transparent); }
  .ask-t { font-size: 12.5px; color: var(--warn); margin-bottom: 9px; line-height: 1.6; }
  .ask-q { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 8px 12px; border-radius: 8px;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); background: transparent;
    color: var(--text); font-size: 12.5px; font-family: inherit; cursor: pointer; transition: all .15s; line-height: 1.6; }
  .ask-q:hover { background: color-mix(in srgb, var(--warn) 12%, transparent); transform: translateX(2px); }
  .ask-in { display: flex; gap: 8px; margin-top: 10px; }
  .ask-in input { flex: 1; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; font-family: inherit; outline: none;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    background: color-mix(in srgb, var(--panel) 60%, transparent); color: var(--text); }
  .ask-in input:focus { border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
  .ask-go { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #b45309, #c2410c); font-size: 12.5px; font-family: inherit; font-weight: 600; }

  .inputbar { padding: 14px 16px 8px; border-top: 1px solid color-mix(in srgb, var(--blue) 14%, transparent); }
  .inbox { display: flex; gap: 10px; align-items: flex-end; }
  .inbox textarea {
    flex: 1; resize: none; max-height: 130px; padding: 12px 15px;
    border-radius: 11px; border: 1px solid color-mix(in srgb, var(--blue) 28%, transparent);
    background: color-mix(in srgb, var(--panel) 65%, transparent); color: var(--text); font-size: 13.5px;
    font-family: inherit; line-height: 1.6; outline: none; transition: border-color .15s;
  }
  .inbox textarea:focus { border-color: color-mix(in srgb, var(--blue) 60%, transparent); }
  .send {
    flex: none; padding: 12px 24px; border-radius: 11px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #1a56c4, #0f8a5f); color: #fff;
    font-size: 14px; font-weight: 700; font-family: inherit; transition: all .2s;
  }
  .send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(26,86,196,.4); }
  .send:disabled { opacity: .5; cursor: wait; }

  /* ---- 图片上传 ---- */
  .inbox .attach {
    flex: none; width: 46px; height: 46px; border-radius: 11px; cursor: pointer; font-size: 17px;
    border: 1px dashed color-mix(in srgb, var(--blue) 38%, transparent);
    background: color-mix(in srgb, var(--panel) 65%, transparent); color: var(--text-2);
    transition: all .15s; font-family: inherit;
  }
  .inbox .attach:hover { border-color: color-mix(in srgb, var(--blue) 60%, transparent); color: var(--blue); }
  .thumbs { display: none; gap: 8px; flex-wrap: wrap; margin: 0 2px 8px; }
  .thumb { position: relative; }
  .thumb img { width: 54px; height: 54px; object-fit: cover; border-radius: 9px; display: block;
    border: 1px solid color-mix(in srgb, var(--blue) 30%, transparent); }
  .thumb .rm { position: absolute; top: -6px; right: -6px; width: 17px; height: 17px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 11px; line-height: 17px; padding: 0; text-align: center;
    background: var(--red); color: #fff; }
  .msg.me .bub img.pic { display: block; max-width: 250px; max-height: 190px; border-radius: 9px;
    margin-top: 8px; object-fit: contain; }

  footer { margin-top: auto; text-align: center; padding: 10px 0 14px; font-size: 12px; color: color-mix(in srgb, var(--text-2) 60%, transparent); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .side { position: static; } }
</style>
</head>
<body>
<header>
  <div class="logo"><img class="dot" src="logo.png" alt="CyberNWT Logo">CyberNWT</div>
  <nav>
    <a href="home.html">首页</a>

  <button class="tswitch" id="theme-toggle" aria-label="切换深浅色模式" title="切换深浅色模式" aria-pressed="false">
    <span class="seg seg-sun"><svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>
    <span class="seg seg-moon"><svg class="ic-moon" viewBox="0 0 24 24"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></span>

<main>
  <aside class="card side">
    <div>
      <h3>场景快捷入口</h3>
      <button class="scene" data-q="深信服 AF 防火墙今天整机上架加电后，管理口 ping 不通，STAT 灯常亮绿色，应该按什么顺序排查？">整机上架
        <small>上架加电 / 初始化 / 管理不通</small></button>
      <button class="scene" data-q="明天凌晨要对核心交换做防火墙割接替换，请帮我梳理一份割接步骤和回退方案要点。">割接切换

      <button class="scene" data-q="如何采集深信服设备的诊断日志和 show 信息给原厂分析？需要哪些关键命令输出？">日志与信息采集
        <small>诊断日志 / show 命令 / 取证</small></button>
      <button class="scene" data-q="客户现场要求做安全策略整改，防火墙策略从 800 条精简，请给出策略梳理与优化的方法。">安全策略优化
        <small>策略精简 / 权限收敛 / 合规</small></button>
    </div>
    <button class="ghost" id="clear-btn">清空会话</button>
  </aside>

  <section class="card chat">
    <div class="chat-head">
      <div class="avatar">🛠️</div>
      <div><b>灵犀诊断助手</b><small>深信服设备实施故障专家 · 上架 / 割接 / 配置 / 链路</small></div>
      <div class="hint2">提示：现象写得越具体（型号、时间点、报错、最近变更），定位越快</div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="inputbar">
      <div class="thumbs" id="thumbs"></div>
      <div class="inbox">
        <button class="attach" id="attach-btn" type="button"
                title="上传图片（告警页面 / 日志截图 / 拓扑图 / 面板指示灯），最多 3 张；也可直接 Ctrl+V 粘贴截图">📎</button>
        <textarea id="inp" rows="1" placeholder="请描述故障现象、拓扑与环境或者直接粘贴日志 /show 输出：(Ctrl+Enter 发送)"></textarea>
        <button class="send" id="send-btn">发 送</button>
      </div>
      <input type="file" id="file-inp" accept="image/*" multiple hidden>
    </div>
  </section>
</main>

<footer>CyberNWT · 演示环境</footer>
<script src="whiteboard.js" defer></script>
<script>
(function () {
  'use strict';

  'use strict';

  // ---------- 深浅色模式切换 ----------
  var rootEl = document.documentElement;
  var themeBtn = document.getElementById('theme-toggle');
  var THEME_COLORS = { dark: '#0A0A0A', light: '#FAFAFA' };
  function setTheme(t) {
    rootEl.setAttribute('data-theme', t);
    themeBtn.setAttribute('aria-pressed', t === 'light' ? 'true' : 'false');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME_COLORS[t]);
  }
  setTheme(rootEl.getAttribute('data-theme'));
  themeBtn.addEventListener('click', function () {
    var next = rootEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    setTheme(next);
    try { localStorage.setItem('cyber-theme', next); } catch (e) {}
  });
  // 用户未手动选择过主题时，跟随系统变化
  var schemeMq = matchMedia('(prefers-color-scheme: light)');
  (schemeMq.addEventListener ? schemeMq.addEventListener.bind(schemeMq, 'change')
                             : schemeMq.addListener.bind(schemeMq))(function (e) {
    var saved = null;
    try { saved = localStorage.getItem('cyber-theme'); } catch (err) {}
    if (saved !== 'light' && saved !== 'dark') {
      setTheme(e.matches ? 'light' : 'dark');
    }
  });

  fetch('/api/me').then(function (r) {
    if (r.status === 401) { location.href = 'login.html'; return null; }
    return r.json();
  }).then(function (data) {
    if (data && data.ok) document.getElementById('username').textContent = data.username;
  }).catch(function () { location.href = 'login.html'; });
  document.getElementById('logout-btn').addEventListener('click', function () {
    fetch('/api/logout', { method: 'POST' }).then(function () { location.href = 'login.html'; });
  });

  var $ = function (s) { return document.querySelector(s); };
  var msgs = $('#msgs');
  var history = [];   // 发送给 AI 的上下文
  var busy = false;

  /* ---- 极简 Markdown 渲染（安全转义后；支持表格/标题/加粗/列表，追问行由补充卡片展示 ---- */
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function md(src) {
    var lines = esc(src).split('\n');
    var out = [], inUl = false, inTable = false, tRows = [];
    function closeUl() { if (inUl) { out.push('</ul>'); inUl = false; } }
    function closeTable() {
      if (!inTable) return;
      inTable = false;
      if (!tRows.length) return;
      var t = ['<table>'];
      tRows.forEach(function (cells, ri) {
        t.push('<tr>');
        cells.forEach(function (c) { t.push(ri === 0 ? '<th>' + c + '</th>' : '<td>' + c + '</td>'); });
        t.push('</tr>');
      });
      t.push('</table>');
      out.push(t.join(''));
      tRows = [];
    }
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      var bolded = ln.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
      /* 追问行不在正文重复展示，由下方补充信息卡片承载 */
      if (/^\s*追问\s*\d*\s*[：:]/.test(ln)) continue;
      if (/^\s*\|.*\|\s*$/.test(ln)) {
        if (/^\s*\|[\s:\-|]+\|\s*$/.test(ln)) continue;   // 跳过分隔行 |---|---|
        closeUl();
        var cells = ln.trim().replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) {
          return c.trim().replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
        });
        if (!inTable) { inTable = true; tRows = []; }
        tRows.push(cells);
        continue;
      }
      closeTable();
      if (/^#{1,4}\s+/.test(ln)) {
        closeUl();
        out.push('<div class="md-h">' + bolded.replace(/^#{1,4}\s+/, '') + '</div>');
        continue;
      }
      if (/^\s*[-*]\s+/.test(ln)) {
        if (!inUl) { out.push('<ul style="margin:4px 0 4px 18px">'); inUl = true; }
        out.push('<li>' + bolded.replace(/^\s*[-*]\s+/, '') + '</li>');
        continue;
      }
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (!ln.trim()) { out.push('<div style="height:6px"></div>'); continue; }
      out.push('<div>' + bolded + '</div>');
    }
    closeTable();
    if (inUl) out.push('</ul>');
    return out.join('');
  }

  function bubble(role, text, imgs) {
    var d = document.createElement('div');
    d.className = 'msg ' + (role === 'user' ? 'me' : 'ai');
    var who = role === 'user'
      ? '<div class="mini">👤</div>'
      : '<div class="mini">🛠️</div>';
    var b = document.createElement('div');
    b.className = 'bub';
    b.innerHTML = text ? md(text) : '<span class="typing"><i></i><i></i><i></i></span>';
    if (role === 'user' && imgs && imgs.length) {
      imgs.forEach(function (u) {
        var im = document.createElement('img');
        im.className = 'pic';
        im.src = u;
        im.alt = '上传的图片';
        b.appendChild(im);
      });
    }
    d.innerHTML = who;
    d.appendChild(b);
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return b;
  }

  /* 打字机：先按纯文本流出，结束再整体渲染为富文本 */
  function typewrite(bub, full, done) {
    var i = 0;
    var timer = setInterval(function () {
      i = Math.min(full.length, i + 3);
      bub.textContent = full.slice(0, i);
      msgs.scrollTop = msgs.scrollHeight;
      if (i >= full.length) {
        clearInterval(timer);
        bub.innerHTML = md(full);
        msgs.scrollTop = msgs.scrollHeight;
        done && done();
      }
    }, 12);
  }

  function welcome() {
    history = [];
    msgs.innerHTML = '';
    bubble('ai', '你好，我是**灵犀诊断助手**，专注深信服设备实施过程中的故障定位：整机上架、割接切换、VPN 组网、链路质量、无线 roaming 等场景都可以问我。\n\n把**故障现象 + 设备型号 + 最近变更**告诉我，或直接粘贴日志、**点 📎 上传截图**（告警页面 / 面板指示灯 / 拓扑图 / 日志照片），我会给出结构化的排查路径。也可以点左侧场景快捷入口快速提问。');
  }

  /* 根据问题内容生成思考步骤：等待大模型期间逐条展示，让工程师看到进展 */
  function thinkSteps(q, hasImg) {
    var t = q.toLowerCase();
    var isSupp = /^\s*补充/.test(q);
    var devices = [];
    if (/(^|[^a-z])af([^a-z]|$)|防火墙/.test(t)) devices.push('AF 下一代防火墙');
    if (/(^|[^a-z])ac([^a-z]|$)|上网行为/.test(t)) devices.push('AC 上网行为管理');
    if (/(^|[^a-z])ad([^a-z]|$)|应用交付|负载均衡/.test(t)) devices.push('AD 应用交付');
    if (/edr|终端安全/.test(t)) devices.push('EDR 终端安全');
    if (/(^|[^a-z])ap([^a-z]|$)|无线|wifi|wlan/.test(t)) devices.push('无线 AC/AP');
    var scen = null;
    if (/vpn|ipsec|ike|隧道|ssl/.test(t)) scen = 'VPN 隧道协商';
    else if (/割接|切换|迁移/.test(t)) scen = '割接切换';
    else if (/丢包|变慢|卡顿|延迟|中断/.test(t)) scen = '链路质量';
    else if (/上架|加电|装机|初始化/.test(t)) scen = '整机上架';
    else if (/策略|放行|封堵/.test(t)) scen = '安全策略';
    var steps = [];
    if (isSupp) steps.push('已接收工程师补充的信息，正在与原故障上下文关联比对……');
    if (hasImg) steps.push('正在读取上传的图片，识别告警 / 日志 / 拓扑 / 面板指示灯关键信息……');
    steps.push('解析故障描述：提取「现象 / 环境 / 时间点 / 最近变更」四要素……');
    steps.push(devices.length
      ? '识别设备对象：' + devices.join('、') + '，按对应产品线知识域展开……'
      : '识别设备对象：未指明具体型号，按通用网络排障路径展开……');
    steps.push(scen
      ? '场景归类：命中「' + scen + '」场景，检索知识库对应章节……'
      : '场景归类：结合上下文判断故障域，检索知识库相关章节……');
    steps.push('比对知识库与历史处置案例，筛选高频根因……');
    steps.push('组织排查路径：按「分段定位 → 收敛根因 → 给出验证手段」结构化输出……');
    steps.push('整理最终答复……');
    return steps;
  }

  /* ---- 回答渲染完成后：带表格 → Excel 导出按钮（置于表格上方）；带追问 → 补充信息卡片 ---- */
  function addExtras(ans, raw) {
    if (/^\s*\|.*\|\s*$/m.test(raw)) {
      var btn = document.createElement('button');
      btn.className = 'xl-btn';
      btn.type = 'button';
      btn.textContent = '⬇ 排查清单导出 Excel';
      btn.addEventListener('click', function () { exportExcel(raw); });
      var firstTable = ans.querySelector('table');
      if (firstTable) ans.insertBefore(btn, firstTable);
      else ans.insertBefore(btn, ans.firstChild);
    }
    addAskCard(ans, raw);
  }

  /* 把回复中的 Markdown 表格导出为 Excel（.xls 兼容格式，Excel / WPS 可直接打开） */
  function exportExcel(raw) {
    var rows = [];
    raw.split('\n').forEach(function (ln) {
      if (/^\s*\|.*\|\s*$/.test(ln) && !/^\s*\|[\s:\-|]+\|\s*$/.test(ln)) {
        rows.push(ln.trim().replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) {
          return c.trim().replace(/\*\*/g, '').replace(/`/g, '');
        }));
      }
    });
    if (!rows.length) return;
    var t = ['<table border="1">'];
    rows.forEach(function (r, ri) {
      t.push('<tr>' + r.map(function (c) {
        return (ri === 0 ? '<th>' : '<td>') + esc(c) + (ri === 0 ? '</th>' : '</td>');
      }).join('') + '</tr>');
    });
    t.push('</table>');
    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">' +
      '<head><meta charset="utf-8"><style>table{border-collapse:collapse;font-family:"Microsoft YaHei";font-size:11pt;}' +
      'th{background:#dceafe;border:1px solid #999;padding:6px 10px;}td{border:1px solid #999;padding:6px 10px;}</style></head>' +
      '<body><p><b>排查清单</b>（灵犀诊断助手 · ' + new Date().toLocaleString('zh-CN') + '）</p>' +
      t.join('') + '</body></html>';
    var blob = new Blob(['\ufeff', html], { type: 'application/vnd.ms-excel' });
    var a = document.createElement('a');
    a.download = '排查清单_' + new Date().toISOString().slice(0, 10) + '.xls';
    a.href = URL.createObjectURL(blob);
    a.click();
    URL.revokeObjectURL(a.href);
  }

  /* 追问卡片：信息不足时引导工程师点击问题作答或直接输入，补充后继续下一轮生成 */
  function addAskCard(ans, raw) {
    var qs = [];
    raw.split('\n').forEach(function (ln) {
      var m = ln.match(/^\s*追问\s*\d*\s*[：:]\s*(.+)$/);
      if (m) qs.push(m[1].trim().replace(/\*\*/g, ''));
    });
    if (!qs.length) return;
    var card = document.createElement('div');
    card.className = 'ask';
    var html = '<div class="ask-t">🔎 需要补充的信息 — 点击问题直接作答，或在下方输入，补充后我将继续深入分析</div>';
    qs.forEach(function (q, i) {
      html += '<button class="ask-q" type="button">' + (i + 1) + '. ' + esc(q) + '</button>';
    });
    html += '<div class="ask-in"><input placeholder="在此输入补充信息（型号 / 版本 / 组网 / 日志片段等），回车发送">' +
            '<button class="ask-go" type="button">补充并继续</button></div>';
    card.innerHTML = html;
    ans.appendChild(card);
    card.querySelectorAll('.ask-q').forEach(function (b) {
      b.addEventListener('click', function () {
        var q = b.textContent.replace(/^\d+\.\s*/, '');
        inp.value = '补充说明（' + q + '）：';
        inp.focus();
        inp.dispatchEvent(new Event('input'));
      });
    });
    var box = card.querySelector('.ask-in input');
    function submitSupp() {
      var v = box.value.trim();
      if (!v || busy) return;
      card.remove();
      send('补充信息：' + v);
    }
    card.querySelector('.ask-go').addEventListener('click', submitSupp);
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submitSupp(); }
    });
  }

  function send(text, imgs) {
    imgs = (imgs || []).slice();
    if (busy || (!String(text || '').trim() && !imgs.length)) return false;
    busy = true;
    $('#send-btn').disabled = true;
    var shown = String(text || '').trim() ||
      '请结合我上传的图片（告警页面 / 日志截图 / 拓扑 / 面板指示灯）分析可能的原因，并给出排查建议。';
    bubble('user', shown, imgs);
    var content = shown;
    if (imgs.length) {
      content = [{ type: 'text', text: shown }];
      imgs.forEach(function (u) { content.push({ type: 'image_url', image_url: { url: u } }); });
    }
    history.push({ role: 'user', content: content });

    var bub = bubble('ai', '');
    bub.innerHTML = '';
    var think = document.createElement('div');
    think.className = 'think';
    think.innerHTML = '<div class="think-head"><span>🧠</span>' +
      '<span class="think-label">灵犀深度思考中</span>' +
      '<span class="think-dots"><i></i><i></i><i></i></span>' +
      '<span class="think-time"></span>' +
      '<span class="think-toggle" style="display:none">▾ 展开思考过程</span></div>' +
      '<div class="think-body"></div>';
    var ans = document.createElement('div');
    ans.className = 'ans';
    bub.appendChild(think);
    bub.appendChild(ans);

    var tBody = think.querySelector('.think-body');
    var tTime = think.querySelector('.think-time');
    var tToggle = think.querySelector('.think-toggle');
    var tLabel = think.querySelector('.think-label');
    var steps = thinkSteps(shown, imgs.length > 0);
    var si = 0;
    var t0 = Date.now();
    var stepTimer = setInterval(function () {
      if (si < steps.length) {
        var s = document.createElement('div');
        s.className = 'think-step';
        s.textContent = steps[si++];
        tBody.appendChild(s);
        msgs.scrollTop = msgs.scrollHeight;
      }
    }, 1500);
    var secTimer = setInterval(function () {
      tTime.textContent = '已思考 ' + Math.round((Date.now() - t0) / 1000) + ' 秒';
    }, 1000);

    function finishThink() {
      clearInterval(stepTimer);
      clearInterval(secTimer);
      think.classList.add('done');
      tLabel.textContent = '已深度思考';
      tTime.textContent = '用时 ' + Math.max(1, Math.round((Date.now() - t0) / 1000)) + ' 秒';
      tToggle.style.display = '';
      think.querySelector('.think-head').addEventListener('click', function () {
        var open = think.classList.toggle('open');
        tToggle.textContent = open ? '▴ 收起思考过程' : '▾ 展开思考过程';
      });
    }

    /* 请求只携带最后一条消息的图片（旧图片降级为文字标注），控制请求体积 */
    var recent = history.slice(-10);
    var reqMsgs = recent.map(function (m, i) {
      if (Array.isArray(m.content) && i < recent.length - 1) {
        var t = m.content.filter(function (p) { return p.type === 'text'; })
          .map(function (p) { return p.text; }).join(' ');
        var n = m.content.filter(function (p) { return p.type === 'image_url'; }).length;
        return { role: m.role, content: t + (n ? ' [已附图片×' + n + ']' : '') };
      }
      return m;
    });
    fetch('/api/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scene: 'diagnose', messages: reqMsgs })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (!data.ok) throw new Error(data.message || '服务异常');
      // 思考面板至少展示 1.5 秒，避免演示模式下转瞬即逝
      var wait = Math.max(0, 1500 - (Date.now() - t0));
      setTimeout(function () {
        finishThink();
        typewrite(ans, data.reply, function () {
          history.push({ role: 'assistant', content: data.reply });
          busy = false;
          $('#send-btn').disabled = false;
          addExtras(ans, data.reply);
        });
      }, wait);
    }).catch(function (e) {
      finishThink();
      ans.innerHTML = md('**出错了：**' + (e.message || e) + '\n请确认服务已启动并处于登录状态。');
      busy = false;
      $('#send-btn').disabled = false;
    });
    return true;
  }

  var inp = $('#inp');
  /* ---- 图片上传：按钮选择 + Ctrl+V 粘贴截图，压缩后暂存，随下一条消息发出 ---- */
  var pendingImgs = [];

  function compressImg(file) {
    return new Promise(function (resolve) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var k = Math.min(1, 1280 / Math.max(img.width, img.height));
          var cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(img.width * k));
          cv.height = Math.max(1, Math.round(img.height * k));
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = function () { resolve(null); };
        img.src = fr.result;
      };
      fr.onerror = function () { resolve(null); };
      fr.readAsDataURL(file);
    });
  }

  function addImgs(files) {
    var list = Array.prototype.slice.call(files || [])
      .filter(function (f) { return f && /^image\//.test(f.type); });
    list.slice(0, 3 - pendingImgs.length).forEach(function (f) {
      compressImg(f).then(function (url) {
        if (url) { pendingImgs.push(url); renderThumbs(); }
      });
    });
  }

  function renderThumbs() {
    var box = $('#thumbs');
    box.style.display = pendingImgs.length ? 'flex' : 'none';
    box.innerHTML = '';
    pendingImgs.forEach(function (url, i) {
      var d = document.createElement('div');
      d.className = 'thumb';
      d.innerHTML = '<img alt="待发送图片"><button class="rm" type="button" title="移除">×</button>';
      d.querySelector('img').src = url;
      d.querySelector('.rm').addEventListener('click', function () {
        pendingImgs.splice(i, 1);
        renderThumbs();
      });
      box.appendChild(d);
    });
  }

  function clearComposer() {
    inp.value = '';
    inp.style.height = 'auto';
    pendingImgs = [];
    renderThumbs();
  }

  $('#attach-btn').addEventListener('click', function () { $('#file-inp').click(); });
  $('#file-inp').addEventListener('change', function () {
    addImgs(this.files);
    this.value = '';
  });
  inp.addEventListener('paste', function (e) {
    var items = (e.clipboardData || {}).items || [];
    var files = Array.prototype.filter.call(items, function (it) {
      return it.type && it.type.indexOf('image') === 0;
    }).map(function (it) { return it.getAsFile(); });
    if (files.length) {
      e.preventDefault();
      addImgs(files);
    }
  });

  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (send(inp.value, pendingImgs)) clearComposer();
    }
  });
  inp.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(130, this.scrollHeight) + 'px';
  });
  $('#send-btn').addEventListener('click', function () {
    if (send(inp.value, pendingImgs)) clearComposer();
  });
  document.querySelectorAll('.scene').forEach(function (b) {
    b.addEventListener('click', function () {
      if (send(b.dataset.q, pendingImgs)) {
        pendingImgs = [];
        renderThumbs();
      }
    });
  });
  $('#clear-btn').addEventListener('click', welcome);

  welcome();
})();
</script>
</body>
</html>
